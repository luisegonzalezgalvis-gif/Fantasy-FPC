    function App() {
      const [theme, setTheme] = useState('dark');

      const [activeTab, setActiveTab] = useState('squad');

      const [authMode, setAuthMode] = useState('register');
      const [authForm, setAuthForm] = useState({
        managerName: '',

        favTeam: 'buc',

      });

      const [selectedPlayerModal, setSelectedPlayerModal] = useState(null);
      const [selectedMatchModal, setSelectedMatchModal] = useState(null);
      const [inspectingMember, setInspectingMember] = useState(null);
      const [showCreateLeagueModal, setShowCreateLeagueModal] = useState(false);
      const [showJoinLeagueModal, setShowJoinLeagueModal] = useState(false);

      const [newLeagueName, setNewLeagueName] = useState('');
      const [newLeagueVisibility, setNewLeagueVisibility] = useState('private');
      const [newLeagueDescription, setNewLeagueDescription] = useState('');
      const [newLeagueMaxMembers, setNewLeagueMaxMembers] = useState(12);
      const [newLeagueSquadBudget, setNewLeagueSquadBudget] = useState(65000000);
      const [newLeagueInitialCash, setNewLeagueInitialCash] = useState(25000000);
      const [newLeagueMatchdayPot, setNewLeagueMatchdayPot] = useState(25000000);
      const [joinCodeInput, setJoinCodeInput] = useState('');

      const [searchQuery, setSearchQuery] = useState('');
      const [selectedTeamFilter, setSelectedTeamFilter] = useState('ALL');
      const [selectedPosFilter, setSelectedPosFilter] = useState('ALL');
      const [selectedRoleFilter, setSelectedRoleFilter] = useState('ALL');
      const [sortBy, setSortBy] = useState('value');
      const [bidAmounts, setBidAmounts] = useState({});
      const [countdownText, setCountdownText] = useState('');

      const getColombianDateKey = () => {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      };

      // Reloj en cuenta regresiva hasta las 11:59 PM (cierre de subastas diarias)
      useEffect(() => {
        const updateTimer = () => {
          const now = new Date();
          const closeTime = new Date(now);
          closeTime.setHours(23, 59, 59, 999);
          const diff = Math.max(0, closeTime - now);
          const hrs = String(Math.floor(diff / (1000 * 60 * 60))).padStart(2, '0');
          const mins = String(Math.floor((diff / (1000 * 60)) % 60)).padStart(2, '0');
          const secs = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');
          setCountdownText(`${hrs}h ${mins}m ${secs}s`);
        };
        updateTimer();
        const interval = setInterval(updateTimer, 1000);
        return () => clearInterval(interval);
      }, []);

      const showNotification = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4500);
      };

      const toggleTheme = () => setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));

      useEffect(() => {
        if (!cloudServices.isCloud) {
          localStorage.setItem('fpc_accounts_v5', JSON.stringify(accounts));
          localStorage.setItem('fpc_leagues_v5', JSON.stringify(leagues));
          localStorage.setItem('fpc_members_v5', JSON.stringify(members));
        }
      }, [accounts, leagues, members, cloudServices.isCloud]);

      const appId = typeof __app_id !== 'undefined' ? __app_id : 'fpc-fantasy-colombia';

      useEffect(() => {
        const setupFirebase = async () => {
          const sdk = window.__FPC_FIREBASE_SDK__;
          if (!sdk) return;

          let savedCustomConfig = null;
          try { savedCustomConfig = JSON.parse(localStorage.getItem('fpc_custom_firebase_config') || 'null'); } catch {}

          const envConfig = (typeof __firebase_config !== 'undefined' && __firebase_config) ? JSON.parse(__firebase_config) : null;
          const activeConfig = envConfig || (VERCEL_FIREBASE_CONFIG.apiKey ? VERCEL_FIREBASE_CONFIG : savedCustomConfig);

          if (activeConfig && activeConfig.apiKey) {
            try {
              const app = sdk.initializeApp(activeConfig);
              const auth = sdk.getAuth(app);
              const db = sdk.getFirestore(app);
              setCloudServices({ auth, db, isCloud: true });

              if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await sdk.signInWithCustomToken(auth, __initial_auth_token);
              } else {
                await sdk.signInAnonymously(auth);
              }
              sdk.onAuthStateChanged(auth, (u) => setUser(u));
            } catch (e) {
              console.warn('Usando almacenamiento local sincronizado:', e);
            }
          }
        };

        if (window.__FPC_FIREBASE_SDK__) setupFirebase();
        else window.addEventListener('fpc-firebase-ready', setupFirebase);
      }, []);

      useEffect(() => {
        if (!cloudServices.isCloud || !cloudServices.db || !user) return;
        const sdk = window.__FPC_FIREBASE_SDK__;
        const { db } = cloudServices;

        const unsubAcc = sdk.onSnapshot(sdk.collection(db, 'artifacts', appId, 'public', 'data', 'fpc_accounts'), snap => {
          setAccounts(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        });
        const unsubLg = sdk.onSnapshot(sdk.collection(db, 'artifacts', appId, 'public', 'data', 'fpc_leagues'), snap => {
          const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          setLeagues(list);
        });
        const unsubMem = sdk.onSnapshot(sdk.collection(db, 'artifacts', appId, 'public', 'data', 'fpc_members'), snap => {
          setMembers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        });

        return () => { unsubAcc(); unsubLg(); unsubMem(); };
      }, [cloudServices, user]);

      // Generador de plantilla inicial de 11 jugadores 100% EXCLUSIVOS (sin repetir jugadores de otros usuarios en la liga)
      const generateStarterSquadByBudget = (targetSquadBudget = 65000000, takenPlayerIds = []) => {
        const avgPerPlayer = Math.max(3500000, Math.floor(Number(targetSquadBudget) / 11));
        const maxIndividualValue = Math.min(14000000, Math.floor(avgPerPlayer * 1.45));

        const pickByPosition = (pos, count, currentChosen) => {
          let pool = INITIAL_PLAYERS.filter(
            p => p.pos === pos && !takenPlayerIds.includes(p.id) && !currentChosen.includes(p.id) && p.value <= maxIndividualValue
          );
          if (pool.length < count) {
            pool = INITIAL_PLAYERS.filter(
              p => p.pos === pos && !takenPlayerIds.includes(p.id) && !currentChosen.includes(p.id)
            );
          }
          const shuffled = [...pool].sort(() => 0.5 - Math.random());
          return shuffled.slice(0, count).map(p => p.id);
        };

        let chosen = [];
        chosen = [...chosen, ...pickByPosition('POR', 1, chosen)];
        chosen = [...chosen, ...pickByPosition('DEF', 4, chosen)];
        chosen = [...chosen, ...pickByPosition('MED', 4, chosen)];
        chosen = [...chosen, ...pickByPosition('DEL', 2, chosen)];
        return chosen;
      };

      const enrollManagerInLeague = async (account, targetLeagueObj) => {
        if (!account || !targetLeagueObj) return;
        const targetLeagueId = targetLeagueObj.id;
        const memberDocId = `${targetLeagueId}_${account.id}`;
        const exists = members.some(m => m.id === memberDocId);
        if (exists) return;

        // Jugadores que ya pertenecen a otros usuarios en esta liga (ningún jugador se puede repetir)
        const takenInLeague = members
          .filter(m => m.leagueId === targetLeagueId)
          .flatMap(m => m.squad || []);

        const squadBudgetCap = Number(targetLeagueObj.initialSquadBudget) || 65000000;
        const initialCash = targetLeagueObj.initialCash !== undefined ? Number(targetLeagueObj.initialCash) : 25000000;
        const starter11 = generateStarterSquadByBudget(squadBudgetCap, takenInLeague);

        const newMember = {
          id: memberDocId,
          leagueId: targetLeagueId,
          userId: account.id,
          managerName: account.managerName,
          clubName: account.clubName || `${account.managerName} FC`,
          favTeam: account.favTeam || 'buc',
          budget: initialCash,
          points: 0,
          lastMatchdayPoints: 0,
          squad: starter11,
          lineup: starter11,
          formation: '4-4-2',
          changesUsedThisMatchday: 0,
          joinedAt: Date.now()
        };

        if (cloudServices.isCloud && cloudServices.db && user) {
          const sdk = window.__FPC_FIREBASE_SDK__;
          await sdk.setDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_members', memberDocId), newMember);
        } else {
          setMembers(prev => [...prev, newMember]);
        }
      };

      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        const cleanEmail = authForm.email.trim().toLowerCase();
        const cleanPin = authForm.pin.trim();
        if (!cleanEmail || !cleanPin) {
          showNotification('Ingresa tu usuario/correo y tu PIN', 'error');
          return;
        }

        let targetLeague = null;
        if (authForm.inviteCode.trim()) {
          const found = leagues.find(l => l.code?.toUpperCase() === authForm.inviteCode.trim().toUpperCase());
          if (!found) {
            showNotification(`No existe una liga con el código #${authForm.inviteCode}`, 'error');
            return;
          }
          targetLeague = found;
        }

        if (authMode === 'register') {
          if (!authForm.managerName.trim() || !authForm.clubName.trim()) {
            showNotification('Completa tu nombre de DT y el nombre de tu Club', 'error');
            return;
          }
          const accountId = `dt_${cleanEmail.replace(/[^a-z0-9]/g, '_')}`;
          const newAcc = {
            id: accountId,
            email: cleanEmail,
            pin: cleanPin,
            managerName: authForm.managerName.trim(),
            clubName: authForm.clubName.trim(),
            favTeam: authForm.favTeam || 'buc'
          };

          if (cloudServices.isCloud && cloudServices.db && user) {
            const sdk = window.__FPC_FIREBASE_SDK__;
            await sdk.setDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_accounts', accountId), newAcc);
          } else {
            setAccounts(prev => [...prev.filter(a => a.id !== accountId), newAcc]);
          }

          if (targetLeague) {
            await enrollManagerInLeague(newAcc, targetLeague);
            setCurrentLeagueId(targetLeague.id);
          }
          setActiveAccount(newAcc);
          showNotification(`¡Bienvenido DT ${newAcc.managerName}! Crea una liga o únete a una existente.`);
        } else {
          const found = accounts.find(a => a.email === cleanEmail && a.pin === cleanPin);
          if (!found) {
            showNotification('Usuario o PIN no encontrado. Regístrate primero.', 'error');
            return;
          }
          if (targetLeague) {
            await enrollManagerInLeague(found, targetLeague);
            setCurrentLeagueId(targetLeague.id);
          } else {
            const myFirstMember = members.find(m => m.userId === found.id);
            if (myFirstMember) setCurrentLeagueId(myFirstMember.leagueId);
          }
          setActiveAccount(found);
          showNotification(`¡Bienvenido de nuevo, DT ${found.managerName}!`);
        }
      };

      const currentLeague = useMemo(() => leagues.find(l => l.id === currentLeagueId) || null, [leagues, currentLeagueId]);
      const leagueMembers = useMemo(() => members.filter(m => m.leagueId === currentLeagueId), [members, currentLeagueId]);
      const myMemberProfile = useMemo(() => leagueMembers.find(m => m.userId === activeAccount?.id) || null, [leagueMembers, activeAccount]);
      const publicLeagues = useMemo(() => leagues.filter(l => l.visibility === 'public'), [leagues]);

      // Mapa estricto de propietarios: cada jugador pertenece solo y únicamente a 1 usuario en la liga
      const playerOwnerMap = useMemo(() => {
        const map = {};
        leagueMembers.forEach(m => (m.squad || []).forEach(pId => { map[pId] = m; }));
        return map;
      }, [leagueMembers]);

      const enrichedPlayers = useMemo(() => {
        const custom = currentLeague?.customPlayerStats || {};
        return INITIAL_PLAYERS.map(p => ({ ...p, ...(custom[p.id] || {}) }));
      }, [currentLeague]);

      const mySquadPlayers = useMemo(() => {
        if (!myMemberProfile) return [];
        return (myMemberProfile.squad || []).map(id => enrichedPlayers.find(p => p.id === id)).filter(Boolean);
      }, [myMemberProfile, enrichedPlayers]);

      const teamValue = useMemo(() => mySquadPlayers.reduce((s, p) => s + p.value, 0), [mySquadPlayers]);
      const activeFormation = myMemberProfile?.formation && FORMATIONS[myMemberProfile.formation] ? myMemberProfile.formation : '4-4-2';
      const formationSpec = FORMATIONS[activeFormation];

      const lineupByPos = useMemo(() => {
        const startersIds = myMemberProfile?.lineup || [];
        const starters = mySquadPlayers.filter(p => startersIds.includes(p.id));
        const bench = mySquadPlayers.filter(p => !startersIds.includes(p.id));

        const porList = starters.filter(p => p.pos === 'POR').slice(0, formationSpec.POR);
        const defList = starters.filter(p => p.pos === 'DEF').slice(0, formationSpec.DEF);
        const medList = starters.filter(p => p.pos === 'MED').slice(0, formationSpec.MED);
        const delList = starters.filter(p => p.pos === 'DEL').slice(0, formationSpec.DEL);

        const emptyPOR = Math.max(0, formationSpec.POR - porList.length);
        const emptyDEF = Math.max(0, formationSpec.DEF - defList.length);
        const emptyMED = Math.max(0, formationSpec.MED - medList.length);
        const emptyDEL = Math.max(0, formationSpec.DEL - delList.length);
        const totalEmptySlots = emptyPOR + emptyDEF + emptyMED + emptyDEL;

        return {
          POR: porList,
          DEF: defList,
          MED: medList,
          DEL: delList,
          emptyPOR,
          emptyDEF,
          emptyMED,
          emptyDEL,
          totalEmptySlots,
          emptyPenaltyPoints: totalEmptySlots * -4,
          bench,
          totalStarters: porList.length + defList.length + medList.length + delList.length
        };
      }, [mySquadPlayers, myMemberProfile, formationSpec]);

      const handleChangeFormation = async (newForm) => {
        if (!FORMATIONS[newForm] || !myMemberProfile || !currentLeagueId || !activeAccount) return;
        const spec = FORMATIONS[newForm];
        const currentStarters = mySquadPlayers.filter(p => (myMemberProfile.lineup || []).includes(p.id));

        const nextLineup = [
          ...currentStarters.filter(p => p.pos === 'POR').slice(0, spec.POR).map(p => p.id),
          ...currentStarters.filter(p => p.pos === 'DEF').slice(0, spec.DEF).map(p => p.id),
          ...currentStarters.filter(p => p.pos === 'MED').slice(0, spec.MED).map(p => p.id),
          ...currentStarters.filter(p => p.pos === 'DEL').slice(0, spec.DEL).map(p => p.id)
        ];

        const memberId = `${currentLeagueId}_${activeAccount.id}`;
        if (cloudServices.isCloud && cloudServices.db && user) {
          const sdk = window.__FPC_FIREBASE_SDK__;
          await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_members', memberId), {
            formation: newForm,
            lineup: nextLineup
          });
        } else {
          setMembers(prev => prev.map(m => m.id === memberId ? { ...m, formation: newForm, lineup: nextLineup } : m));
        }
        showNotification(`Formación táctica actualizada a ${newForm}.`);
      };

      const handleToggleLineup = async (playerId) => {
        if (!activeAccount || !myMemberProfile || !currentLeagueId) return;
        const player = enrichedPlayers.find(p => p.id === playerId);
        if (!player) return;

        const currentLineup = myMemberProfile.lineup || [];
        const isStarter = currentLineup.includes(playerId);
        const changesUsed = myMemberProfile.changesUsedThisMatchday || 0;

        let newLineup;
        let nextChangesUsed = changesUsed;

        if (isStarter) {
          newLineup = currentLineup.filter(id => id !== playerId);
        } else {
          if (changesUsed >= MAX_CHANGES_PER_MATCHDAY) {
            showNotification(`Ya agotaste tus ${MAX_CHANGES_PER_MATCHDAY} cambios permitidos en esta fecha (${changesUsed}/${MAX_CHANGES_PER_MATCHDAY}).`, 'error');
            return;
          }
          const samePosStarters = mySquadPlayers.filter(p => currentLineup.includes(p.id) && p.pos === player.pos);
          const maxForPos = formationSpec[player.pos] || 0;
          if (samePosStarters.length >= maxForPos) {
            showNotification(`Tu formación ${activeFormation} solo permite ${maxForPos} jugador(es) en ${player.pos}. Envía uno al banquillo o cambia de formación.`, 'error');
            return;
          }
          newLineup = [...currentLineup, playerId];
          nextChangesUsed = changesUsed + 1;
        }

        const myMemberId = `${currentLeagueId}_${activeAccount.id}`;
        if (cloudServices.isCloud && cloudServices.db && user) {
          const sdk = window.__FPC_FIREBASE_SDK__;
          await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_members', myMemberId), {
            lineup: newLineup,
            changesUsedThisMatchday: nextChangesUsed
          });
        } else {
          setMembers(prev => prev.map(m => m.id === myMemberId ? { ...m, lineup: newLineup, changesUsedThisMatchday: nextChangesUsed } : m));
        }
      };

      const activeAuctions = useMemo(() => currentLeague?.activeAuctions || {}, [currentLeague]);

      // Colocar o superar una puja en la subasta diaria (Cierra a las 11:59 PM)
      const handlePlaceAuctionBid = async (player, rawBidAmount) => {
        if (!activeAccount || !myMemberProfile || !currentLeague) return;
        const bidAmount = rawBidAmount ? Number(rawBidAmount) : player.value;

        const currentOwner = playerOwnerMap[player.id];
        if (currentOwner) {
          showNotification(`Este jugador ya pertenece en exclusividad a ${currentOwner.managerName}. No pueden existir jugadores repetidos.`, 'error');
          return;
        }

        if ((myMemberProfile.squad || []).length >= MAX_SQUAD_SIZE) {
          showNotification(`Ya tienes el tope de ${MAX_SQUAD_SIZE} jugadores en plantilla. Vende antes de pujar.`, 'error');
          return;
        }

        const existingBid = activeAuctions[player.id];
        const minRequiredBid = existingBid ? existingBid.amount + 100000 : player.value;

        if (bidAmount < minRequiredBid) {
          showNotification(
            existingBid
              ? `Debes superar la puja actual de ${existingBid.bidderName} (${formatCOP(existingBid.amount)}). Mínimo: ${formatCOP(minRequiredBid)}`
              : `La puja mínima es el valor base del jugador (${formatCOP(player.value)})`,
            'error'
          );
          return;
        }

        const maxDebtAllowed = -Math.floor(teamValue * 0.35);
        if ((myMemberProfile.budget || 0) - bidAmount < maxDebtAllowed) {
          showNotification(`No tienes capacidad financiera suficiente para sostener una puja de ${formatCOP(bidAmount)}.`, 'error');
          return;
        }

        const updatedAuctions = {
          ...activeAuctions,
          [player.id]: {
            playerId: player.id,
            amount: bidAmount,
            bidderUserId: activeAccount.id,
            bidderMemberId: myMemberProfile.id,
            bidderName: activeAccount.managerName,
            clubName: activeAccount.clubName,
            timestamp: Date.now()
          }
        };

        const bidLog = existingBid
          ? `🔨 ¡Puja superada! ${activeAccount.managerName} subió la oferta por ${player.name} a ${formatCOP(bidAmount)} (superó a ${existingBid.bidderName}).`
          : `🔨 Nueva puja en subasta: ${activeAccount.managerName} ofertó ${formatCOP(bidAmount)} por ${player.name}.`;

        if (cloudServices.isCloud && cloudServices.db && user) {
          const sdk = window.__FPC_FIREBASE_SDK__;
          await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_leagues', currentLeague.id), {
            activeAuctions: updatedAuctions,
            lastLogs: [bidLog, ...(currentLeague.lastLogs || []).slice(0, 9)]
          });
        } else {
          setLeagues(prev => prev.map(l => l.id === currentLeague.id
            ? { ...l, activeAuctions: updatedAuctions, lastLogs: [bidLog, ...(l.lastLogs || []).slice(0, 9)] }
            : l
          ));
        }

        showNotification(`¡Puja registrada por ${player.name} (${formatCOP(bidAmount)})! Si es la mayor a las 11:59 PM, se adjudicará a tu plantilla.`);
      };

      // Liquidar subastas de las 11:59 PM al mejor postor y renovar el mercado de medianoche (00:00) con jugadores libres
      const handleSettleDailyAuctionsAndRotateMarket = async (isAutoMidnight = false) => {
        if (!currentLeague) return;
        const auctionsList = Object.values(currentLeague.activeAuctions || {});
        const updatedMembersMap = {};
        leagueMembers.forEach(m => {
          updatedMembersMap[m.id] = {
            ...m,
            squad: [...(m.squad || [])],
            lineup: [...(m.lineup || [])]
          };
        });

        const occupiedPlayerIds = new Set(leagueMembers.flatMap(m => m.squad || []));
        const settlementLogs = [];

        auctionsList.forEach(auction => {
          const player = enrichedPlayers.find(p => p.id === auction.playerId);
          const winner = updatedMembersMap[auction.bidderMemberId];
          if (!player || !winner) return;

          if (occupiedPlayerIds.has(player.id)) {
            settlementLogs.push(`⚠️ Subasta omitida para ${player.name}: ya tenía propietario exclusivo.`);
            return;
          }
          if (winner.squad.length >= MAX_SQUAD_SIZE) {
            settlementLogs.push(`⚠️ ${winner.managerName} ganó la puja por ${player.name}, pero tenía su plantilla llena (${MAX_SQUAD_SIZE}/${MAX_SQUAD_SIZE}).`);
            return;
          }

          winner.budget = (winner.budget || 0) - auction.amount;
          winner.squad.push(player.id);
          occupiedPlayerIds.add(player.id);

          const fName = winner.formation && FORMATIONS[winner.formation] ? winner.formation : '4-4-2';
          const spec = FORMATIONS[fName];
          const currentPosInLineup = winner.squad
            .map(id => enrichedPlayers.find(p => p.id === id))
            .filter(p => p && winner.lineup.includes(p.id) && p.pos === player.pos).length;

          if (currentPosInLineup < (spec[player.pos] || 0)) {
            winner.lineup.push(player.id);
          }

          settlementLogs.push(`🏆 Subasta 11:59 PM adjudicada: ${player.name} pasa a ${winner.managerName} (${winner.clubName}) por ${formatCOP(auction.amount)}.`);
        });

        const freeAgentsPool = INITIAL_PLAYERS.filter(p => !occupiedPlayerIds.has(p.id));
        const shuffledFree = [...freeAgentsPool].sort(() => 0.5 - Math.random());
        const nextMarketIds = shuffledFree.slice(0, 12).map(p => p.id);
        const todayKey = getColombianDateKey();

        const headerLog = `🌙 Cierre de Mercado (11:59 PM) y Renovación de Medianoche: ${settlementLogs.length} fichajes adjudicados al mejor postor y 12 nuevos agentes libres disponibles.`;

        if (cloudServices.isCloud && cloudServices.db && user) {
          const sdk = window.__FPC_FIREBASE_SDK__;
          for (const mId of Object.keys(updatedMembersMap)) {
            const mem = updatedMembersMap[mId];
            await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_members', mem.id), {
              budget: mem.budget,
              squad: mem.squad,
              lineup: mem.lineup
            });
          }
          await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_leagues', currentLeague.id), {
            marketPlayerIds: nextMarketIds,
            activeAuctions: {},
            marketDateKey: todayKey,
            lastLogs: [headerLog, ...settlementLogs, ...(currentLeague.lastLogs || []).slice(0, 7)]
          });
        } else {
          setMembers(prev => prev.map(m => updatedMembersMap[m.id] ? updatedMembersMap[m.id] : m));
          setLeagues(prev => prev.map(l => l.id === currentLeague.id
            ? {
                ...l,
                marketPlayerIds: nextMarketIds,
                activeAuctions: {},
                marketDateKey: todayKey,
                lastLogs: [headerLog, ...settlementLogs, ...(l.lastLogs || []).slice(0, 7)]
              }
            : l
          ));
        }

        if (!isAutoMidnight) {
          showNotification(`¡Cierre de las 11:59 PM ejecutado! Se adjudicaron ${settlementLogs.length} jugadores al mejor postor y se renovó el mercado.`);
        }
      };

      // Verificación automática al cambiar de fecha a medianoche (00:00)
      useEffect(() => {
        if (!currentLeague) return;
        const todayKey = getColombianDateKey();
        if (currentLeague.marketDateKey && currentLeague.marketDateKey !== todayKey) {
          handleSettleDailyAuctionsAndRotateMarket(true);
        }
      }, [currentLeague?.id, currentLeague?.marketDateKey]);

      const handleSellPlayer = async (player) => {
        if (!activeAccount || !myMemberProfile || !currentLeagueId) return;
        const myMemberId = `${currentLeagueId}_${activeAccount.id}`;
        const updatedSquad = (myMemberProfile.squad || []).filter(id => id !== player.id);

        showNotification(`Vendiste a ${player.name} por ${formatCOP(player.value)}. Ahora queda libre para futuras subastas.`);

      const currentWeekMatches = useMemo(() => {
        const completedIds = currentLeague?.completedMatchIds || ['m1', 'm2', 'm3', 'm4', 'm5', 'm6', 'm7', 'm8', 'm9', 'm10'];
        return MATCHDAYS_2026.f15.matches.map(m => {
          if (completedIds.includes(m.id)) return { ...m, status: 'FINALIZADO' };
          return m;

      }, [currentLeague]);

      const allWeekMatchesFinished = useMemo(() => currentWeekMatches.every(m => m.status === 'FINALIZADO'), [currentWeekMatches]);
      const isMatchday15AlreadySettled = useMemo(() => (currentLeague?.settledMatchdays || []).includes(15), [currentLeague]);

      // Vista previa en tiempo real de cómo se divide el Pozo Inverso entre los DTs actuales
      const inversePotPreview = useMemo(() => {
        const totalPot = Number(currentLeague?.matchdayPot) || 25000000;
        const count = Math.max(1, leagueMembers.length);
        const totalShares = (count * (count + 1)) / 2;
        return Array.from({ length: count }, (_, idx) => {
          const rankInMatchday = idx + 1; // 1 = Ganador de la fecha, count = Último de la fecha
          const weight = rankInMatchday; // El 1° tiene peso 1 (recibe menos); el último tiene peso N (recibe más)
          const rawShare = Math.round(((totalPot * weight) / totalShares) / 100000) * 100000;
          return {
            rank: rankInMatchday,
            weight,
            pct: Math.round((weight / totalShares) * 100),
            amount: rawShare
          };
        });
      }, [currentLeague?.matchdayPot, leagueMembers.length]);

      const handleSettleOfficialMatchday15 = async () => {
        if (!currentLeague || !allWeekMatchesFinished || isMatchday15AlreadySettled) return;

        // 1. Calcular primero los puntos de la jornada de cada usuario
        const scoredMembers = leagueMembers.map(m => {
          if ((m.budget || 0) < 0) {
            return {
              ...m,
              calculatedWeekPts: 0,
              inRedPenalty: true,
              emptyCount: 0,
              penaltyPts: 0
            };
          }

          const fName = m.formation && FORMATIONS[m.formation] ? m.formation : '4-4-2';
          const spec = FORMATIONS[fName];
          const memberSquadObjs = (m.squad || []).map(id => enrichedPlayers.find(p => p.id === id)).filter(Boolean);
          const starters = memberSquadObjs.filter(p => (m.lineup || []).includes(p.id));

          const validPOR = starters.filter(p => p.pos === 'POR').slice(0, spec.POR);
          const validDEF = starters.filter(p => p.pos === 'DEF').slice(0, spec.DEF);
          const validMED = starters.filter(p => p.pos === 'MED').slice(0, spec.MED);
          const validDEL = starters.filter(p => p.pos === 'DEL').slice(0, spec.DEL);
          const validStarters = [...validPOR, ...validDEF, ...validMED, ...validDEL];

          let rawPts = 0;
          validStarters.forEach(pl => {
            const officialWeekPts = pl.last5?.[pl.last5.length - 1] || 6;
            rawPts += officialWeekPts;
          });

          const emptyCount =
            Math.max(0, spec.POR - validPOR.length) +
            Math.max(0, spec.DEF - validDEF.length) +
            Math.max(0, spec.MED - validMED.length) +
            Math.max(0, spec.DEL - validDEL.length);

          const penaltyPts = emptyCount * -4;
          const totalWeekPts = rawPts + penaltyPts;

          return {
            ...m,
            calculatedWeekPts: totalWeekPts,
            inRedPenalty: false,
            emptyCount,
            penaltyPts
          };
        });

        // 2. Ordenar de MAYOR a MENOR puntaje en la jornada para repartir el Pozo de forma INVERSA:
        // Posición 1 (Ganador de la jornada) -> Recibe la menor proporción (peso 1)
        // Última posición en la jornada -> Recibe la mayor proporción (peso N)
        const sortedByMatchdayDesc = [...scoredMembers].sort((a, b) => {
          if (b.calculatedWeekPts !== a.calculatedWeekPts) return b.calculatedWeekPts - a.calculatedWeekPts;
          return (a.points || 0) - (b.points || 0);
        });

        const totalPot = Number(currentLeague.matchdayPot) || 25000000;
        const n = Math.max(1, sortedByMatchdayDesc.length);
        const totalShares = (n * (n + 1)) / 2;

        const potDistributionSummary = [];
        const updatedMembers = sortedByMatchdayDesc.map((m, idx) => {
          const matchdayRank = idx + 1; // 1 = Ganador, n = Último
          const inverseWeight = matchdayRank; // Peso 1 para el 1°, Peso N para el último
          const potReward = Math.round(((totalPot * inverseWeight) / totalShares) / 100000) * 100000;

          potDistributionSummary.push(
            `#${matchdayRank} Jornada: ${m.managerName} (${m.calculatedWeekPts} pts) recibe ${formatCOP(potReward)}`
          );

          return {
            ...m,
            points: (m.points || 0) + m.calculatedWeekPts,
            lastMatchdayPoints: m.calculatedWeekPts,
            lastMatchdayRank: matchdayRank,
            lastPotReward: potReward,
            budget: (m.budget || 0) + potReward,
            changesUsedThisMatchday: 0,
            lastSettlementNote: m.inRedPenalty
              ? `Saldo en rojo (0 pts) • Pozo #${matchdayRank}: +${formatCOP(potReward)}`
              : `Puesto #${matchdayRank} en la Fecha • Pozo recibido: +${formatCOP(potReward)}`
          };
        });

        const settledList = [...(currentLeague.settledMatchdays || []), 15];
        const logMsg = `💰 Fecha 15 liquidada • Pozo de ${formatCOP(totalPot)} repartido de forma inversa (Último recibe más, 1° recibe menos): ${potDistributionSummary.join(' | ')}`;

        if (cloudServices.isCloud && cloudServices.db && user) {
          const sdk = window.__FPC_FIREBASE_SDK__;
          for (const mem of updatedMembers) {
            await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_members', mem.id), {
              points: mem.points,
              lastMatchdayPoints: mem.lastMatchdayPoints,
              lastMatchdayRank: mem.lastMatchdayRank,
              lastPotReward: mem.lastPotReward,
              lastSettlementNote: mem.lastSettlementNote,
              budget: mem.budget,
              changesUsedThisMatchday: 0
            });
          }
          await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_leagues', currentLeague.id), {
            matchday: 15,
            settledMatchdays: settledList,
            lastLogs: [logMsg, ...(currentLeague.lastLogs || []).slice(0, 8)]
          });
        } else {
          setMembers(prev => prev.map(m => {
            const found = updatedMembers.find(u => u.id === m.id);
            return found || m;
          }));
          setLeagues(prev => prev.map(l => l.id === currentLeague.id ? {
            ...l,
            matchday: 15,
            settledMatchdays: settledList,
            lastLogs: [logMsg, ...(l.lastLogs || []).slice(0, 8)]
          } : l));
        }

        showNotification(`¡Fecha 15 liquidada! El pozo de ${formatCOP(totalPot)} se repartió dando más al último de la jornada y menos al 1°.`);
      };

      const handleCreateLeague = async (e) => {
        e.preventDefault();
        if (!activeAccount || !newLeagueName.trim()) return;
        const code = Math.random().toString(36).substring(2, 8).toUpperCase();
        const leagueId = `liga-${Date.now()}`;
        const squadBudgetCap = Number(newLeagueSquadBudget) || 65000000;
        const cashAmount = Number(newLeagueInitialCash) || 25000000;
        const potAmount = Number(newLeagueMatchdayPot) || 25000000;

        // Primero generamos la plantilla exclusiva del fundador para que el mercado diario no incluya sus jugadores
        const founderSquad = generateStarterSquadByBudget(squadBudgetCap, []);
        const freePool = INITIAL_PLAYERS.filter(p => !founderSquad.includes(p.id));
        const shuffledFree = [...freePool].sort(() => 0.5 - Math.random());

        const newLeague = {
          id: leagueId,
          name: newLeagueName.trim(),
          code,
          visibility: newLeagueVisibility,
          description: newLeagueDescription.trim() || (newLeagueVisibility === 'public' ? 'Liga pública abierta a todos los DTs.' : 'Liga privada exclusiva con código de invitación.'),
          maxMembers: Number(newLeagueMaxMembers) || 12,
          initialSquadBudget: squadBudgetCap,
          initialCash: cashAmount,
          matchdayPot: potAmount,
          createdBy: activeAccount.id,
          creatorName: activeAccount.managerName,
          matchday: 14,
          settledMatchdays: [14],
          completedMatchIds: ['m1', 'm2', 'm3', 'm4', 'm5', 'm6', 'm7', 'm8', 'm9', 'm10'],
          marketPlayerIds: shuffledFree.slice(0, 12).map(p => p.id),
          activeAuctions: {},
          marketDateKey: getColombianDateKey(),
          lastLogs: [
            `🏆 Liga ${newLeagueVisibility === 'public' ? 'Pública' : 'Privada'} "${newLeagueName.trim()}" creada por ${activeAccount.managerName}. Código: #${code}`,
            `💰 Configuración inicial: Plantilla (~${formatCOP(squadBudgetCap)}) + ${formatCOP(cashAmount)} efectivo + Pozo Inverso por Fecha de ${formatCOP(potAmount)}.`
          ]
        };

        };

          await sdk.setDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_members', founderMember.id), founderMember);

        showNotification(`¡Liga "${newLeague.name}" creada! Te entregamos 11 jugadores exclusivos y ${formatCOP(cashAmount)} en efectivo.`);

      const handleJoinLeagueByObject = async (targetLeague) => {

        setShowJoinLeagueModal(false);

      const buildMatchReportData = (match) => {
        if (!match) return null;
        const buildTeamSheet = (teamId) => {
          const clubPlayers = enrichedPlayers.filter(p => p.teamId === teamId);
          const titulares = clubPlayers.filter(p => p.role === 'Titular');
          const otros = clubPlayers.filter(p => p.role !== 'Titular');

          const starters11 = [...titulares, ...otros].slice(0, 11);
          const benchList = clubPlayers.filter(p => !starters11.some(s => s.id === p.id)).slice(0, 7);

          const subMinutes = ["61'", "73'", "82'"];
          const substitutions = [];
          for (let i = 0; i < Math.min(3, benchList.length); i++) {
            const playerIn = benchList[i];
            const playerOut = starters11[starters11.length - 1 - i];
            if (playerIn && playerOut) {
              substitutions.push({
                minute: subMinutes[i],
                playerIn,
                playerOut
              });
            }
          }

          return { starters11, benchList, substitutions };
        };

        return {
          homeTeam: getTeamById(match.home),
          awayTeam: getTeamById(match.away),
          homeSheet: buildTeamSheet(match.home),
          awaySheet: buildTeamSheet(match.away)
        };
      };

      const filteredDatabasePlayers = useMemo(() => {
        return enrichedPlayers
          .filter(p => {
            const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
            const matchesTeam = selectedTeamFilter === 'ALL' || p.teamId === selectedTeamFilter;
            const matchesPos = selectedPosFilter === 'ALL' || p.pos === selectedPosFilter;

          .sort((a, b) => b[sortBy] - a[sortBy]);
      }, [enrichedPlayers, searchQuery, selectedTeamFilter, selectedPosFilter, selectedRoleFilter, sortBy]);

            <div>

                </span>

                    >
                      <option value={50000000}>$50.0M COP (Plantilla Modesta)</option>
                      <option value={65000000}>$65.0M COP (Plantilla Estándar)</option>
                      <option value={80000000}>$80.0M COP (Plantilla Competitiva)</option>
                      <option value={100000000}>$100.0M COP (Plantilla Élite)</option>
                    </select>
                  </div>

                  <div className="bg-slate-950 border border-slate-800 rounded-xl p-3">
                    <label className="block text-[11px] font-black text-amber-400 mb-1">
                      Efectivo Libre Adicional (Para Subastas)
                    </label>
                    <select
                      value={newLeagueInitialCash}
                      onChange={e => setNewLeagueInitialCash(Number(e.target.value))}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-2 text-xs font-bold text-white"
                    >
                      <option value={10000000}>$10.0M COP en Efectivo</option>
                      <option value={25000000}>$25.0M COP en Efectivo</option>
                      <option value={45000000}>$45.0M COP en Efectivo</option>
                      <option value={60000000}>$60.0M COP en Efectivo</option>
                    </select>
                  </div>
                </div>

                <div className="bg-slate-950 border border-emerald-500/40 rounded-xl p-3">
                  <label className="block text-[11px] font-black text-emerald-400 mb-1">
                    💰 Pozo por Fecha (Distribución Inversa: Último de la jornada recibe más, 1° recibe menos)
                  </label>
                  <select
                    value={newLeagueMatchdayPot}
                    onChange={e => setNewLeagueMatchdayPot(Number(e.target.value))}
                    className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-2 text-xs font-bold text-white"
                  >
                    <option value={15000000}>Pozo de $15.0M COP por Fecha</option>
                    <option value={25000000}>Pozo de $25.0M COP por Fecha (Recomendado)</option>
                    <option value={40000000}>Pozo de $40.0M COP por Fecha</option>
                    <option value={60000000}>Pozo de $60.0M COP por Fecha</option>
                  </select>
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setShowCreateLeagueModal(false)} className="px-4 py-2 rounded-xl bg-slate-800 text-xs font-bold text-slate-300 cursor-pointer">
                    Cancelar
                  </button>
                  <button type="submit" className="px-5 py-2 rounded-xl bg-emerald-500 text-slate-950 text-xs font-black cursor-pointer">
                    Fundar Liga y Entregar Plantilla
                  </button>
                </div>
              </form>
            </div>
          )}

          {showJoinLeagueModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 space-y-5">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-black text-white">Unirse a una Liga</h3>
                  <button onClick={() => setShowJoinLeagueModal(false)} className="text-slate-400 hover:text-white text-sm font-bold cursor-pointer">✕</button>
                </div>

                <form
                  onSubmit={async e => {
                    e.preventDefault();
                    const target = leagues.find(l => l.code?.toUpperCase() === joinCodeInput.trim().toUpperCase());
                    if (!target) {
                      showNotification('Código de liga no encontrado', 'error');
                      return;
                    }
                    await handleJoinLeagueByObject(target);
                    setJoinCodeInput('');
                  }}
                  className="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3"
                >
                  <label className="block text-xs font-black text-amber-400">🔒 Entrar con Código de Invitación</label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      required
                      value={joinCodeInput}
                      onChange={e => setJoinCodeInput(e.target.value)}
                      placeholder="Ej. A7B9K2"
                      className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-white uppercase font-mono"
                    />
                    <button type="submit" className="px-4 py-2 rounded-xl bg-amber-500 text-slate-950 text-xs font-black cursor-pointer">
                      Unirme
                    </button>
                  </div>
                </form>

                <div>
                  <h4 className="text-xs font-black uppercase text-emerald-400 mb-2">🌐 Ligas Públicas Abiertas ({publicLeagues.length})</h4>
                  {publicLeagues.length === 0 ? (
                    <p className="text-xs text-slate-400">Aún no hay ligas públicas creadas.</p>
                  ) : (
                    <div className="space-y-2 max-h-56 overflow-y-auto pr-1">
                      {publicLeagues.map(pl => (
                        <div key={pl.id} className="bg-slate-950 border border-slate-800 rounded-xl p-3 flex items-center justify-between">
                          <div>
                            <div className="text-sm font-bold text-white">{pl.name}</div>
                            <div className="text-[11px] text-slate-400">
                              Plantilla: {formatCOP(pl.initialSquadBudget || 65000000)} • Efectivo: {formatCOP(pl.initialCash || 25000000)}
                            </div>
                          </div>
                          <button
                            onClick={() => handleJoinLeagueByObject(pl)}
                            className="px-3 py-1.5 rounded-xl bg-emerald-500 text-slate-950 font-black text-xs cursor-pointer"
                          >
                            Entrar
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {inspectingMember && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 space-y-4 max-h-[80vh] flex flex-col">
                <div className="flex items-start justify-between">
                  <div>
                    <h3 className="text-lg font-black text-white">{inspectingMember.managerName} • {inspectingMember.clubName}</h3>
                    <p className="text-xs text-slate-400">Presupuesto: {formatCOP(inspectingMember.budget || 0)}</p>
                  </div>
                  <button onClick={() => setInspectingMember(null)} className="text-slate-400 hover:text-white text-sm font-bold cursor-pointer">✕</button>
                </div>
                <div className="space-y-2 overflow-y-auto pr-1">
                  {(inspectingMember.squad || []).map(pId => {
                    const pl = enrichedPlayers.find(p => p.id === pId);
                    if (!pl) return null;
                    return (
                      <div key={pl.id} className="bg-slate-950 border border-slate-800 rounded-xl p-3 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                          <TeamCrest teamId={pl.teamId} size="sm" />
                          <div>
                            <div className="text-sm font-bold text-white">{pl.name} ({pl.pos})</div>
                            <div className="text-xs text-slate-400">{getTeamById(pl.teamId).name} • {formatCOP(pl.value)}</div>
                          </div>
                        </div>
                        <span className="text-[11px] font-bold text-emerald-400 bg-emerald-950 px-2.5 py-1 rounded-lg border border-emerald-500/30">
                          Exclusivo de {inspectingMember.managerName}
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
