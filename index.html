    function App() {
      const [theme, setTheme] = useState('dark');

      const [newLeagueMaxMembers, setNewLeagueMaxMembers] = useState(12);

      const getColombianDateKey = () => {

      };

      useEffect(() => {

          const now = new Date();

          closeTime.setHours(23, 59, 59, 999);
          const diff = Math.max(0, closeTime - now);
          const hrs = String(Math.floor(diff / (1000 * 60 * 60))).padStart(2, '0');
          const mins = String(Math.floor((diff / (1000 * 60)) % 60)).padStart(2, '0');
          const secs = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');
          setCountdownText(`${hrs}h ${mins}m ${secs}s`);
        };
        updateTimer();
        const interval = setInterval(updateTimer, 1000);
        return () => clearInterval(interval);
      }, []);

      const showNotification = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4500);
      };

      const toggleTheme = () => setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));

      useEffect(() => {
        if (!cloudServices.isCloud) {
          localStorage.setItem('fpc_accounts_v6', JSON.stringify(accounts));

          localStorage.setItem('fpc_members_v6', JSON.stringify(members));
        }
      }, [accounts, leagues, members, cloudServices.isCloud]);

      const appId = typeof __app_id !== 'undefined' ? __app_id : 'fpc-fantasy-colombia';

      useEffect(() => {
        const setupFirebase = async () => {
          const sdk = window.__FPC_FIREBASE_SDK__;
          if (!sdk) return;
          const envConfig = (typeof __firebase_config !== 'undefined' && __firebase_config) ? JSON.parse(__firebase_config) : VERCEL_FIREBASE_CONFIG;
          if (envConfig && envConfig.apiKey) {
            try {
              const app = sdk.initializeApp(envConfig);
              const auth = sdk.getAuth(app);
              const db = sdk.getFirestore(app);
              setCloudServices({ auth, db, isCloud: true });
              if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await sdk.signInWithCustomToken(auth, __initial_auth_token);
              } else {
                await sdk.signInAnonymously(auth);
              }
              sdk.onAuthStateChanged(auth, (u) => setUser(u));
            } catch (e) {
              console.warn(e);
            }
          }
        };
        if (window.__FPC_FIREBASE_SDK__) setupFirebase();
        else window.addEventListener('fpc-firebase-ready', setupFirebase);
      }, []);

      useEffect(() => {
        if (!cloudServices.isCloud || !cloudServices.db || !user) return;
        const sdk = window.__FPC_FIREBASE_SDK__;
        const { db } = cloudServices;
        const unsubAcc = sdk.onSnapshot(sdk.collection(db, 'artifacts', appId, 'public', 'data', 'fpc_accounts'), snap => {
          setAccounts(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        }, err => console.error(err));
        const unsubLg = sdk.onSnapshot(sdk.collection(db, 'artifacts', appId, 'public', 'data', 'fpc_leagues'), snap => {
          setLeagues(snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(l => !l.isDeleted));
        }, err => console.error(err));
        const unsubMem = sdk.onSnapshot(sdk.collection(db, 'artifacts', appId, 'public', 'data', 'fpc_members'), snap => {
          setMembers(snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(m => !m.isDeleted));
        }, err => console.error(err));
        return () => { unsubAcc(); unsubLg(); unsubMem(); };
      }, [cloudServices, user]);

      const generateStarterSquadByBudget = (targetSquadBudget = 65000000, takenPlayerIds = []) => {
        const avgPerPlayer = Math.max(3500000, Math.floor(Number(targetSquadBudget) / 11));
        const maxIndividualValue = Math.min(14000000, Math.floor(avgPerPlayer * 1.45));

        const pickByPosition = (pos, count, currentChosen) => {
          let pool = INITIAL_PLAYERS.filter(
            p => p.pos === pos && !takenPlayerIds.includes(p.id) && !currentChosen.includes(p.id) && p.value <= maxIndividualValue
          );
          if (pool.length < count) {
            pool = INITIAL_PLAYERS.filter(
              p => p.pos === pos && !takenPlayerIds.includes(p.id) && !currentChosen.includes(p.id)
            );
          }
          const shuffled = [...pool].sort(() => 0.5 - Math.random());
          return shuffled.slice(0, count).map(p => p.id);
        };

        let chosen = [];
        chosen = [...chosen, ...pickByPosition('POR', 1, chosen)];
        chosen = [...chosen, ...pickByPosition('DEF', 4, chosen)];
        chosen = [...chosen, ...pickByPosition('MED', 4, chosen)];
        chosen = [...chosen, ...pickByPosition('DEL', 2, chosen)];
        return chosen;
      };

      const enrollManagerInLeague = async (account, targetLeagueObj) => {
        if (!account || !targetLeagueObj) return;
        const targetLeagueId = targetLeagueObj.id;
        const memberDocId = `${targetLeagueId}_${account.id}`;
        const exists = members.some(m => m.id === memberDocId);
        if (exists) return;

        const takenInLeague = members
          .filter(m => m.leagueId === targetLeagueId)
          .flatMap(m => m.squad || []);

        const squadBudgetCap = Number(targetLeagueObj.initialSquadBudget) || 65000000;
        const initialCash = targetLeagueObj.initialCash !== undefined ? Number(targetLeagueObj.initialCash) : 25000000;
        const starter11 = generateStarterSquadByBudget(squadBudgetCap, takenInLeague);

        const newMember = {
          id: memberDocId,
          leagueId: targetLeagueId,
          userId: account.id,
          managerName: account.managerName,
          clubName: account.clubName || `${account.managerName} FC`,
          favTeam: account.favTeam || 'buc',
          budget: initialCash,
          points: 0,
          lastMatchdayPoints: 0,
          squad: starter11,
          lineup: starter11,
          formation: '4-4-2',
          changesUsedThisMatchday: 0,
          joinedAt: Date.now()
        };

        if (cloudServices.isCloud && cloudServices.db && user) {
          const sdk = window.__FPC_FIREBASE_SDK__;
          await sdk.setDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_members', memberDocId), newMember);
        } else {
          setMembers(prev => [...prev, newMember]);
        }
      };

      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        const cleanEmail = authForm.email.trim().toLowerCase();
        const cleanPin = authForm.pin.trim();
        if (!cleanEmail || !cleanPin) {
          showNotification('Ingresa tu usuario y tu PIN', 'error');
          return;
        }

        let targetLeague = null;
        if (authForm.inviteCode.trim()) {
          const found = leagues.find(l => l.code?.toUpperCase() === authForm.inviteCode.trim().toUpperCase());
          if (!found) {
            showNotification(`No existe liga con el código #${authForm.inviteCode}`, 'error');
            return;
          }
          targetLeague = found;
        }

        if (authMode === 'register') {
          if (!authForm.managerName.trim() || !authForm.clubName.trim()) {
            showNotification('Completa tu nombre de DT y el nombre de tu Club', 'error');
            return;
          }
          const accountId = `dt_${cleanEmail.replace(/[^a-z0-9]/g, '_')}`;
          const newAcc = {
            id: accountId,
            email: cleanEmail,
            pin: cleanPin,
            managerName: authForm.managerName.trim(),
            clubName: authForm.clubName.trim(),
            favTeam: authForm.favTeam || 'buc'
          };

          if (cloudServices.isCloud && cloudServices.db && user) {
            const sdk = window.__FPC_FIREBASE_SDK__;
            await sdk.setDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_accounts', accountId), newAcc);
          } else {
            setAccounts(prev => [...prev.filter(a => a.id !== accountId), newAcc]);
          }

          if (targetLeague) {
            await enrollManagerInLeague(newAcc, targetLeague);
            setCurrentLeagueId(targetLeague.id);
          }
          setActiveAccount(newAcc);
          showNotification(`¡Bienvenido DT ${newAcc.managerName}!`);
        } else {
          const found = accounts.find(a => a.email === cleanEmail && a.pin === cleanPin);
          if (!found) {
            showNotification('Usuario o PIN incorrecto.', 'error');
            return;
          }
          if (targetLeague) {
            await enrollManagerInLeague(found, targetLeague);
            setCurrentLeagueId(targetLeague.id);
          } else {
            const myFirstMember = members.find(m => m.userId === found.id);
            if (myFirstMember) setCurrentLeagueId(myFirstMember.leagueId);
          }
          setActiveAccount(found);
          showNotification(`¡Bienvenido de nuevo, DT ${found.managerName}!`);
        }
      };

      const currentLeague = useMemo(() => leagues.find(l => l.id === currentLeagueId) || null, [leagues, currentLeagueId]);
      const leagueMembers = useMemo(() => members.filter(m => m.leagueId === currentLeagueId), [members, currentLeagueId]);
      const myMemberProfile = useMemo(() => leagueMembers.find(m => m.userId === activeAccount?.id) || null, [leagueMembers, activeAccount]);
      const publicLeagues = useMemo(() => leagues.filter(l => l.visibility === 'public'), [leagues]);

      const playerOwnerMap = useMemo(() => {
        const map = {};
        leagueMembers.forEach(m => (m.squad || []).forEach(pId => { map[pId] = m; }));
        return map;
      }, [leagueMembers]);

      const enrichedPlayers = useMemo(() => {
        const custom = currentLeague?.customPlayerStats || {};
        return INITIAL_PLAYERS.map(p => ({ ...p, ...(custom[p.id] || {}) }));
      }, [currentLeague]);

      const mySquadPlayers = useMemo(() => {
        if (!myMemberProfile) return [];
        return (myMemberProfile.squad || []).map(id => enrichedPlayers.find(p => p.id === id)).filter(Boolean);
      }, [myMemberProfile, enrichedPlayers]);

      const teamValue = useMemo(() => mySquadPlayers.reduce((s, p) => s + p.value, 0), [mySquadPlayers]);
      const activeFormation = myMemberProfile?.formation && FORMATIONS[myMemberProfile.formation] ? myMemberProfile.formation : '4-4-2';
      const formationSpec = FORMATIONS[activeFormation];

      const lineupByPos = useMemo(() => {
        const startersIds = myMemberProfile?.lineup || [];
        const starters = mySquadPlayers.filter(p => startersIds.includes(p.id));
        const bench = mySquadPlayers.filter(p => !startersIds.includes(p.id));

        const porList = starters.filter(p => p.pos === 'POR').slice(0, formationSpec.POR);
        const defList = starters.filter(p => p.pos === 'DEF').slice(0, formationSpec.DEF);
        const medList = starters.filter(p => p.pos === 'MED').slice(0, formationSpec.MED);
        const delList = starters.filter(p => p.pos === 'DEL').slice(0, formationSpec.DEL);

        const emptyPOR = Math.max(0, formationSpec.POR - porList.length);
        const emptyDEF = Math.max(0, formationSpec.DEF - defList.length);
        const emptyMED = Math.max(0, formationSpec.MED - medList.length);
        const emptyDEL = Math.max(0, formationSpec.DEL - delList.length);
        const totalEmptySlots = emptyPOR + emptyDEF + emptyMED + emptyDEL;

        return {
          POR: porList, DEF: defList, MED: medList, DEL: delList,
          emptyPOR, emptyDEF, emptyMED, emptyDEL, totalEmptySlots,
          emptyPenaltyPoints: totalEmptySlots * -4,
          bench,
          totalStarters: porList.length + defList.length + medList.length + delList.length
        };
      }, [mySquadPlayers, myMemberProfile, formationSpec]);

      const handleChangeFormation = async (newForm) => {
        if (!FORMATIONS[newForm] || !myMemberProfile || !currentLeagueId || !activeAccount) return;
        const spec = FORMATIONS[newForm];
        const currentStarters = mySquadPlayers.filter(p => (myMemberProfile.lineup || []).includes(p.id));

        const nextLineup = [
          ...currentStarters.filter(p => p.pos === 'POR').slice(0, spec.POR).map(p => p.id),
          ...currentStarters.filter(p => p.pos === 'DEF').slice(0, spec.DEF).map(p => p.id),
          ...currentStarters.filter(p => p.pos === 'MED').slice(0, spec.MED).map(p => p.id),
          ...currentStarters.filter(p => p.pos === 'DEL').slice(0, spec.DEL).map(p => p.id)
        ];

        const memberId = `${currentLeagueId}_${activeAccount.id}`;
        if (cloudServices.isCloud && cloudServices.db && user) {
          const sdk = window.__FPC_FIREBASE_SDK__;
          await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_members', memberId), {
            formation: newForm, lineup: nextLineup
          });
        } else {
          setMembers(prev => prev.map(m => m.id === memberId ? { ...m, formation: newForm, lineup: nextLineup } : m));
        }
        showNotification(`Formación actualizada a ${newForm}`);
      };

      const handleToggleLineup = async (playerId) => {
        if (!activeAccount || !myMemberProfile || !currentLeagueId) return;
        const player = enrichedPlayers.find(p => p.id === playerId);
        if (!player) return;

        const currentLineup = myMemberProfile.lineup || [];
        const isStarter = currentLineup.includes(playerId);
        const changesUsed = myMemberProfile.changesUsedThisMatchday || 0;

        let newLineup;
        let nextChangesUsed = changesUsed;

        if (isStarter) {
          newLineup = currentLineup.filter(id => id !== playerId);
        } else {
          if (changesUsed >= MAX_CHANGES_PER_MATCHDAY) {
            showNotification(`Agotaste tus ${MAX_CHANGES_PER_MATCHDAY} cambios permitidos en esta fecha.`, 'error');
            return;
          }
          const samePosStarters = mySquadPlayers.filter(p => currentLineup.includes(p.id) && p.pos === player.pos);
          const maxForPos = formationSpec[player.pos] || 0;
          if (samePosStarters.length >= maxForPos) {
            showNotification(`La formación ${activeFormation} solo permite ${maxForPos} en ${player.pos}.`, 'error');
            return;
          }
          newLineup = [...currentLineup, playerId];
          nextChangesUsed = changesUsed + 1;
        }

        const myMemberId = `${currentLeagueId}_${activeAccount.id}`;
        if (cloudServices.isCloud && cloudServices.db && user) {
          const sdk = window.__FPC_FIREBASE_SDK__;
          await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_members', myMemberId), {
            lineup: newLineup, changesUsedThisMatchday: nextChangesUsed
          });
        } else {
          setMembers(prev => prev.map(m => m.id === myMemberId ? { ...m, lineup: newLineup, changesUsedThisMatchday: nextChangesUsed } : m));
        }
      };

      const activeAuctions = useMemo(() => currentLeague?.activeAuctions || {}, [currentLeague]);

      const handlePlaceAuctionBid = async (player, rawBidAmount) => {
        if (!activeAccount || !myMemberProfile || !currentLeague) return;
        const dailyMarketIds = currentLeague.marketPlayerIds || [];
        if (!dailyMarketIds.includes(player.id)) {
          showNotification(`Solo se puede pujar por los 12 jugadores de la Subasta Diaria de hoy.`, 'error');
          return;
        }

        const bidAmount = rawBidAmount ? Number(rawBidAmount) : player.value;
        const currentOwner = playerOwnerMap[player.id];
        if (currentOwner) {
          showNotification(`Este jugador ya pertenece a ${currentOwner.managerName}. No hay jugadores repetidos.`, 'error');
          return;
        }

        if ((myMemberProfile.squad || []).length >= MAX_SQUAD_SIZE) {
          showNotification(`Tienes el tope de ${MAX_SQUAD_SIZE} jugadores en plantilla. Vende antes de pujar.`, 'error');
          return;
        }

        const existingBid = activeAuctions[player.id];
        const minRequiredBid = existingBid ? existingBid.amount + 100000 : player.value;

        if (bidAmount < minRequiredBid) {
          showNotification(existingBid ? `Supera la puja de ${existingBid.bidderName} (${formatCOP(existingBid.amount)}).` : `Puja mínima: ${formatCOP(player.value)}`, 'error');
          return;
        }

        const updatedAuctions = {
          ...activeAuctions,
          [player.id]: {
            playerId: player.id,
            amount: bidAmount,
            bidderUserId: activeAccount.id,
            bidderMemberId: myMemberProfile.id,
            bidderName: activeAccount.managerName,
            clubName: activeAccount.clubName,
            timestamp: Date.now()
          }
        };

        const bidLog = existingBid
          ? `🔨 ${activeAccount.managerName} pujó ${formatCOP(bidAmount)} por ${player.name} (superó a ${existingBid.bidderName}).`
          : `🔨 ${activeAccount.managerName} ofertó ${formatCOP(bidAmount)} por ${player.name} en subasta.`;

        if (cloudServices.isCloud && cloudServices.db && user) {
          const sdk = window.__FPC_FIREBASE_SDK__;
          await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_leagues', currentLeague.id), {
            activeAuctions: updatedAuctions,
            lastLogs: [bidLog, ...(currentLeague.lastLogs || []).slice(0, 9)]
          });
        } else {
          setLeagues(prev => prev.map(l => l.id === currentLeague.id ? { ...l, activeAuctions: updatedAuctions, lastLogs: [bidLog, ...(l.lastLogs || []).slice(0, 9)] } : l));
        }
        showNotification(`¡Puja registrada por ${player.name} (${formatCOP(bidAmount)})!`);
      };

      const handleSettleDailyAuctionsAndRotateMarket = async (isAuto = false) => {
        if (!currentLeague) return;
        const auctionsList = Object.values(currentLeague.activeAuctions || {});
        const updatedMembersMap = {};
        leagueMembers.forEach(m => {
          updatedMembersMap[m.id] = { ...m, squad: [...(m.squad || [])], lineup: [...(m.lineup || [])] };
        });

        const occupiedPlayerIds = new Set(leagueMembers.flatMap(m => m.squad || []));
        const settlementLogs = [];

        auctionsList.forEach(auction => {
          const player = enrichedPlayers.find(p => p.id === auction.playerId);
          const winner = updatedMembersMap[auction.bidderMemberId];
          if (!player || !winner) return;
          if (occupiedPlayerIds.has(player.id) || winner.squad.length >= MAX_SQUAD_SIZE) return;

          winner.budget = (winner.budget || 0) - auction.amount;
          winner.squad.push(player.id);
          occupiedPlayerIds.add(player.id);

          const fName = winner.formation && FORMATIONS[winner.formation] ? winner.formation : '4-4-2';
          const spec = FORMATIONS[fName];
          const currentPosInLineup = winner.squad.map(id => enrichedPlayers.find(p => p.id === id)).filter(p => p && winner.lineup.includes(p.id) && p.pos === player.pos).length;
          if (currentPosInLineup < (spec[player.pos] || 0)) winner.lineup.push(player.id);

          settlementLogs.push(`🏆 Subasta adjudicada: ${player.name} para ${winner.managerName} por ${formatCOP(auction.amount)}.`);
        });

        const freeAgentsPool = INITIAL_PLAYERS.filter(p => !occupiedPlayerIds.has(p.id));
        const shuffledFree = [...freeAgentsPool].sort(() => 0.5 - Math.random());
        const nextMarketIds = shuffledFree.slice(0, 12).map(p => p.id);
        const todayKey = getColombianDateKey();

        const logMsg = `🌙 Cierre 11:59 PM: ${settlementLogs.length} fichajes adjudicados y mercado renovado con 12 nuevos agentes libres.`;

        if (cloudServices.isCloud && cloudServices.db && user) {
          const sdk = window.__FPC_FIREBASE_SDK__;
          for (const mId of Object.keys(updatedMembersMap)) {
            const mem = updatedMembersMap[mId];
            await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_members', mem.id), {
              budget: mem.budget, squad: mem.squad, lineup: mem.lineup
            });
          }
          await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_leagues', currentLeague.id), {
            marketPlayerIds: nextMarketIds, activeAuctions: {}, marketDateKey: todayKey,
            lastLogs: [logMsg, ...settlementLogs, ...(currentLeague.lastLogs || []).slice(0, 7)]
          });
        } else {
          setMembers(prev => prev.map(m => updatedMembersMap[m.id] ? updatedMembersMap[m.id] : m));
          setLeagues(prev => prev.map(l => l.id === currentLeague.id ? {
            ...l, marketPlayerIds: nextMarketIds, activeAuctions: {}, marketDateKey: todayKey,
            lastLogs: [logMsg, ...settlementLogs, ...(l.lastLogs || []).slice(0, 7)]
          } : l));
        }
        if (!isAuto) showNotification('¡Cierre 11:59 PM ejecutado con éxito!');
      };

      useEffect(() => {
        if (!currentLeague) return;
        const todayKey = getColombianDateKey();
        if (currentLeague.marketDateKey && currentLeague.marketDateKey !== todayKey) {
          handleSettleDailyAuctionsAndRotateMarket(true);
        }
      }, [currentLeague?.id, currentLeague?.marketDateKey]);

      const handleSellPlayer = async (player) => {
        if (!activeAccount || !myMemberProfile || !currentLeagueId) return;
        const myMemberId = `${currentLeagueId}_${activeAccount.id}`;
        const updatedSquad = (myMemberProfile.squad || []).filter(id => id !== player.id);
        const updatedLineup = (myMemberProfile.lineup || []).filter(id => id !== player.id);

        if (cloudServices.isCloud && cloudServices.db && user) {

          await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_members', myMemberId), {

          });
        } else {
          setMembers(prev => prev.map(m => m.id === myMemberId ? { ...m, budget: m.budget + player.value, squad: updatedSquad, lineup: updatedLineup } : m));

        showNotification(`Vendiste a ${player.name} por ${formatCOP(player.value)}`);
      };

      const inversePotPreview = useMemo(() => {
        const totalPot = Number(currentLeague?.matchdayPot) || 25000000;
        const count = Math.max(1, leagueMembers.length);
        const totalShares = (count * (count + 1)) / 2;
        return Array.from({ length: count }, (_, idx) => {
          const rankInMatchday = idx + 1;
          const weight = rankInMatchday; // El último tiene más peso
          const rawShare = Math.round(((totalPot * weight) / totalShares) / 100000) * 100000;
          return { rank: rankInMatchday, amount: rawShare };
        });
      }, [currentLeague?.matchdayPot, leagueMembers.length]);

      const handleSettleOfficialMatchday15 = async () => {
        if (!currentLeague) return;
        const scoredMembers = leagueMembers.map(m => {
          if ((m.budget || 0) < 0) return { ...m, calculatedWeekPts: 0, inRedPenalty: true };
          const fName = m.formation && FORMATIONS[m.formation] ? m.formation : '4-4-2';
          const spec = FORMATIONS[fName];
          const memberSquadObjs = (m.squad || []).map(id => enrichedPlayers.find(p => p.id === id)).filter(Boolean);
          const starters = memberSquadObjs.filter(p => (m.lineup || []).includes(p.id));

          const validPOR = starters.filter(p => p.pos === 'POR').slice(0, spec.POR);
          const validDEF = starters.filter(p => p.pos === 'DEF').slice(0, spec.DEF);
          const validMED = starters.filter(p => p.pos === 'MED').slice(0, spec.MED);
          const validDEL = starters.filter(p => p.pos === 'DEL').slice(0, spec.DEL);
          const validStarters = [...validPOR, ...validDEF, ...validMED, ...validDEL];

          let rawPts = 0;
          validStarters.forEach(pl => { rawPts += (pl.last5?.[pl.last5.length - 1] || 6); });

          const emptyCount =
            Math.max(0, spec.POR - validPOR.length) +
            Math.max(0, spec.DEF - validDEF.length) +
            Math.max(0, spec.MED - validMED.length) +
            Math.max(0, spec.DEL - validDEL.length);

          return { ...m, calculatedWeekPts: rawPts + (emptyCount * -4), inRedPenalty: false };
        });

        const sortedByMatchdayDesc = [...scoredMembers].sort((a, b) => b.calculatedWeekPts - a.calculatedWeekPts);
        const totalPot = Number(currentLeague.matchdayPot) || 25000000;
        const n = Math.max(1, sortedByMatchdayDesc.length);
        const totalShares = (n * (n + 1)) / 2;

        const updatedMembers = sortedByMatchdayDesc.map((m, idx) => {
          const matchdayRank = idx + 1; // 1 = Ganador (menos pozo), n = Último (más pozo)
          const potReward = Math.round(((totalPot * matchdayRank) / totalShares) / 100000) * 100000;
          return {
            ...m,
            points: (m.points || 0) + m.calculatedWeekPts,
            lastMatchdayPoints: m.calculatedWeekPts,
            lastMatchdayRank: matchdayRank,
            lastPotReward: potReward,
            budget: (m.budget || 0) + potReward,
            changesUsedThisMatchday: 0
          };
        });

        const logMsg = `💰 Fecha 15 liquidada. Pozo inverso de ${formatCOP(totalPot)} repartido (El último de la fecha recibió más).`;

        if (cloudServices.isCloud && cloudServices.db && user) {
          const sdk = window.__FPC_FIREBASE_SDK__;
          for (const mem of updatedMembers) {
            await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_members', mem.id), {
              points: mem.points, lastMatchdayPoints: mem.lastMatchdayPoints, lastMatchdayRank: mem.lastMatchdayRank,
              lastPotReward: mem.lastPotReward, budget: mem.budget, changesUsedThisMatchday: 0

          }
          await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_leagues', currentLeague.id), {
            matchday: 15, lastLogs: [logMsg, ...(currentLeague.lastLogs || []).slice(0, 8)]
          });
        } else {
          setMembers(prev => prev.map(m => updatedMembers.find(u => u.id === m.id) || m));
          setLeagues(prev => prev.map(l => l.id === currentLeague.id ? { ...l, matchday: 15, lastLogs: [logMsg, ...(l.lastLogs || []).slice(0, 8)] } : l));
        }

      const handleJoinLeagueByObject = async (targetLeague) => {

      const handleConfirmResetLeague = async (targetLeague) => {

        const cashAmount = targetLeague.initialCash !== undefined ? Number(targetLeague.initialCash) : 25000000;
        const targetMembers = members.filter(m => m.leagueId === targetLeague.id);

        let takenPlayerIds = [];

        const resetLog = `🔄 Liga "${targetLeague.name}" reiniciada.`;

        if (cloudServices.isCloud && cloudServices.db && user) {

          for (const mem of resetMembersList) {

            matchday: 14, marketPlayerIds: nextMarketIds, activeAuctions: {}, customPlayerStats: {}, marketDateKey: getColombianDateKey(), lastLogs: [resetLog]

        } else {

          setLeagues(prev => prev.map(l => l.id === targetLeague.id ? {
            ...l, matchday: 14, marketPlayerIds: nextMarketIds, activeAuctions: {}, customPlayerStats: {}, marketDateKey: getColombianDateKey(), lastLogs: [resetLog]

      const handleConfirmDeleteLeague = async (targetLeague) => {

                </div>
                <div className="grid grid-cols-3 gap-2 my-4 bg-slate-950 p-3 rounded-xl border border-slate-800 text-center">
                  <div><span className="text-[10px] text-slate-400 block">Sofascore</span><span className="text-lg font-black text-emerald-400">★{selectedPlayerModal.sofaRating}</span></div>
                  <div><span className="text-[10px] text-slate-400 block">Puntos</span><span className="text-lg font-black text-amber-400">{selectedPlayerModal.points}</span></div>
                  <div><span className="text-[10px] text-slate-400 block">Valor</span><span className="text-sm font-black text-white">{formatCOP(selectedPlayerModal.value)}</span></div>
                </div>
                <div className="grid grid-cols-3 gap-2 mb-4 bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80 text-center text-xs">
                  <div><span className="text-[10px] text-slate-400 block">Goles</span><span className="font-black text-white">⚽ {selectedPlayerModal.goals}</span></div>
                  <div><span className="text-[10px] text-slate-400 block">Asistencias</span><span className="font-black text-white">👟 {selectedPlayerModal.assists}</span></div>
                  <div><span className="text-[10px] text-slate-400 block">Valla Invicta</span><span className="font-black text-white">🧤 {selectedPlayerModal.cleanSheets}</span></div>
                </div>
                <div className="flex gap-2">
                  {(myMemberProfile?.squad || []).includes(selectedPlayerModal.id) ? (
                    <>
                      <button onClick={() => { handleToggleLineup(selectedPlayerModal.id); setSelectedPlayerModal(null); }} className="flex-1 py-2.5 rounded-xl bg-emerald-500 text-slate-950 font-black text-xs cursor-pointer">
                        {(myMemberProfile?.lineup || []).includes(selectedPlayerModal.id) ? 'Enviar al Banquillo' : 'Poner Titular'}
                      </button>
                      <button onClick={() => { handleSellPlayer(selectedPlayerModal); setSelectedPlayerModal(null); }} className="px-4 py-2.5 rounded-xl bg-rose-500/20 text-rose-300 font-bold text-xs cursor-pointer">Vender</button>
                    </>
                  ) : playerOwnerMap[selectedPlayerModal.id] ? (
                    <div className="w-full py-2.5 px-3 rounded-xl bg-slate-950 border border-slate-800 text-center text-xs text-slate-300">
                      Propietario: <strong className="text-amber-400">{playerOwnerMap[selectedPlayerModal.id].managerName}</strong>
                    </div>
                  ) : (
                    <button onClick={() => { setSelectedPlayerModal(null); setActiveTab('market'); }} className="w-full py-2.5 rounded-xl bg-amber-500 text-slate-950 font-black text-xs cursor-pointer shadow">
                      Ir a Subasta Diaria ({formatCOP(selectedPlayerModal.value)})
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Modal Reiniciar / Eliminar Liga */}
          {leagueActionModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-black text-white">{leagueActionModal.type === 'reset' ? '🔄 ¿Reiniciar Liga?' : '🗑️ ¿Eliminar Liga?'}</h3>
                  <button onClick={() => setLeagueActionModal(null)} className="text-slate-400 hover:text-white cursor-pointer">✕</button>
                </div>
                <p className="text-xs text-slate-300">
                  {leagueActionModal.type === 'reset' ? 'Todos los puntos volverán a 0 y se asignarán nuevas plantillas iniciales.' : 'La liga será eliminada permanentemente para todos los usuarios.'}
                </p>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setLeagueActionModal(null)} className="px-4 py-2 rounded-xl bg-slate-800 text-xs font-bold text-slate-300 cursor-pointer">Cancelar</button>
                  <button onClick={() => leagueActionModal.type === 'reset' ? handleConfirmResetLeague(leagueActionModal.league) : handleConfirmDeleteLeague(leagueActionModal.league)} className={`px-4 py-2 rounded-xl text-xs font-black cursor-pointer shadow ${leagueActionModal.type === 'reset' ? 'bg-amber-500 text-slate-950' : 'bg-rose-600 text-white'}`}>
                    Confirmar
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
