        let active = true;

          setRawUrl(known);
          setAttemptMode('direct');

            setLeagues(snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(l => !l.isDeleted));
          }, err => console.warn(err.message));
          unsubMem = sdk.onSnapshot(sdk.collection(db, 'artifacts', appId, 'public', 'data', 'fpc_members'), snap => {
            setMembers(snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(m => !m.isDeleted));
          }, err => console.warn(err.message));
        } catch (e) {}
        return () => { try { unsubAcc(); unsubLg(); unsubMem(); } catch {} };
      }, [cloudServices, user]);

      const currentLeague = useMemo(() => leagues.find(l => l.id === currentLeagueId) || null, [leagues, currentLeagueId]);
      const leagueMembers = useMemo(() => members.filter(m => m.leagueId === currentLeagueId), [members, currentLeagueId]);
      const myMemberProfile = useMemo(() => leagueMembers.find(m => m.userId === activeAccount?.id) || null, [leagueMembers, activeAccount]);
      const publicLeagues = useMemo(() => leagues.filter(l => l.visibility === 'public'), [leagues]);

      // Permiso estricto: Solo el creador de la liga puede liquidar fechas, reiniciar o eliminar
      const isLeagueCreator = useMemo(() => {
        if (!currentLeague || !activeAccount) return false;
        return currentLeague.createdBy === activeAccount.id;
      }, [currentLeague, activeAccount]);

      // Historial blindado de jornadas ya liquidadas (combina BD + Tablón de Logs + LocalStorage + Ref en memoria)
      const settledMatchdays = useMemo(() => {
        if (!currentLeague) return [];
        const fromDb = Array.isArray(currentLeague.settledMatchdays) ? currentLeague.settledMatchdays : [];
        const set = new Set(fromDb);
        if (Number(currentLeague.matchday) >= 15) set.add('f15');
        if (Number(currentLeague.matchday) >= 16) set.add('f16');
        (currentLeague.lastLogs || []).forEach(log => {
          if (typeof log === 'string') {
            if (log.includes('Fecha 15 liquidada')) set.add('f15');
            if (log.includes('Fecha 16 liquidada')) set.add('f16');
            if (log.includes('Fecha 17 liquidada')) set.add('f17');
          }
        });
        (localSettledLock[currentLeague.id] || []).forEach(k => set.add(k));
        (settledInMemoryRef.current[currentLeague.id] || []).forEach(k => set.add(k));
        return Array.from(set);
      }, [currentLeague, localSettledLock]);

      const isMatchdayPlayableToSettle = (mdKey) => {
        const mdObj = MATCHDAYS_2026[mdKey];
        if (!mdObj || !Array.isArray(mdObj.matches)) return false;
        return mdObj.matches.every(m => m.status === 'FINALIZADO' && m.score !== 'VS');
      };

      const playerOwnerMap = useMemo(() => {
        const map = {};
        leagueMembers.forEach(m => (m.squad || []).forEach(pId => { map[pId] = m; }));
        return map;
      }, [leagueMembers]);

      const enrichedPlayers = useMemo(() => {
        const custom = currentLeague?.customPlayerStats || {};
        return INITIAL_PLAYERS.map(p => ({ ...p, ...(custom[p.id] || {}) }));
      }, [currentLeague]);

      const mySquadPlayers = useMemo(() => {
        if (!myMemberProfile) return [];
        return (myMemberProfile.squad || []).map(id => enrichedPlayers.find(p => p.id === id)).filter(Boolean);
      }, [myMemberProfile, enrichedPlayers]);

      const teamValue = useMemo(() => mySquadPlayers.reduce((s, p) => s + p.value, 0), [mySquadPlayers]);
      const activeFormation = myMemberProfile?.formation && FORMATIONS[myMemberProfile.formation] ? myMemberProfile.formation : '4-4-2';
      const formationSpec = FORMATIONS[activeFormation];

      const lineupByPos = useMemo(() => {
        const startersIds = myMemberProfile?.lineup || [];
        const starters = mySquadPlayers.filter(p => startersIds.includes(p.id));
        const bench = mySquadPlayers.filter(p => !startersIds.includes(p.id));

        const porList = starters.filter(p => p.pos === 'POR').slice(0, formationSpec.POR);
        const defList = starters.filter(p => p.pos === 'DEF').slice(0, formationSpec.DEF);
        const medList = starters.filter(p => p.pos === 'MED').slice(0, formationSpec.MED);
        const delList = starters.filter(p => p.pos === 'DEL').slice(0, formationSpec.DEL);

        const emptyPOR = Math.max(0, formationSpec.POR - porList.length);
        const emptyDEF = Math.max(0, formationSpec.DEF - defList.length);
        const emptyMED = Math.max(0, formationSpec.MED - medList.length);
        const emptyDEL = Math.max(0, formationSpec.DEL - delList.length);
        const totalEmptySlots = emptyPOR + emptyDEF + emptyMED + emptyDEL;

        return {
          POR: porList, DEF: defList, MED: medList, DEL: delList,
          emptyPOR, emptyDEF, emptyMED, emptyDEL, totalEmptySlots,
          emptyPenaltyPoints: totalEmptySlots * -4,
          bench,
          totalStarters: porList.length + defList.length + medList.length + delList.length
        };
      }, [mySquadPlayers, myMemberProfile, formationSpec]);

      const generateStarterSquadByBudget = (targetSquadBudget = 65000000, takenPlayerIds = []) => {
        const avgPerPlayer = Math.max(4000000, Math.floor(Number(targetSquadBudget) / 11));
        const maxIndividualValue = Math.min(14500000, Math.floor(avgPerPlayer * 1.55));
        const pickByPosition = (pos, count, currentChosen) => {
          let pool = INITIAL_PLAYERS.filter(p => p.pos === pos && !takenPlayerIds.includes(p.id) && !currentChosen.includes(p.id) && p.value <= maxIndividualValue);
          if (pool.length < count) {
            pool = INITIAL_PLAYERS.filter(p => p.pos === pos && !takenPlayerIds.includes(p.id) && !currentChosen.includes(p.id));
          }
          return [...pool].sort(() => 0.5 - Math.random()).slice(0, count).map(p => p.id);
        };
        let chosen = [];
        chosen = [...chosen, ...pickByPosition('POR', 1, chosen)];
        chosen = [...chosen, ...pickByPosition('DEF', 4, chosen)];
        chosen = [...chosen, ...pickByPosition('MED', 4, chosen)];
        chosen = [...chosen, ...pickByPosition('DEL', 2, chosen)];
        return chosen;
      };

      const enrollManagerInLeague = async (account, targetLeagueObj) => {
        if (!account || !targetLeagueObj) return;
        const targetLeagueId = targetLeagueObj.id;
        const memberDocId = `${targetLeagueId}_${account.id}`;
        if (members.some(m => m.id === memberDocId)) return;

        const takenInLeague = members.filter(m => m.leagueId === targetLeagueId).flatMap(m => m.squad || []);
        const squadBudgetCap = Number(targetLeagueObj.initialSquadBudget) || 65000000;
        const initialCash = targetLeagueObj.initialCash !== undefined ? Number(targetLeagueObj.initialCash) : 25000000;
        const starter11 = generateStarterSquadByBudget(squadBudgetCap, takenInLeague);

        const newMember = {
          id: memberDocId,
          leagueId: targetLeagueId,
          userId: account.id,
          managerName: account.managerName,
          clubName: account.clubName || `${account.managerName} FC`,
          favTeam: account.favTeam || 'nal',
          budget: initialCash,
          points: 0,
          lastMatchdayPoints: 0,
          squad: starter11,
          lineup: starter11,
          captainId: starter11[0] || null,
          formation: '4-4-2',
          changesUsedThisMatchday: 0,
          joinedAt: Date.now()
        };

        setMembers(prev => [...prev, newMember]);
        if (cloudServices.isCloud && cloudServices.db && user) {
          try {
            const sdk = window.__FPC_FIREBASE_SDK__;
            await sdk.setDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_members', memberDocId), newMember);
          } catch (e) {}
        }
      };

      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        const cleanEmail = authForm.email.trim().toLowerCase();
        const cleanPin = authForm.pin.trim();
        if (!cleanEmail || !cleanPin) {
          showNotification('Ingresa tu usuario y tu PIN', 'error');
          return;
        }

        let targetLeague = null;
        if (authForm.inviteCode.trim()) {
          const found = leagues.find(l => l.code?.toUpperCase() === authForm.inviteCode.trim().toUpperCase());
          if (!found) {
            showNotification(`No existe liga con el código #${authForm.inviteCode}`, 'error');
            return;
          }
          targetLeague = found;
        }

        if (authMode === 'register') {
          if (!authForm.managerName.trim() || !authForm.clubName.trim()) {
            showNotification('Completa tu nombre de DT y tu Club', 'error');
            return;
          }
          const accountId = `dt_${cleanEmail.replace(/[^a-z0-9]/g, '_')}`;
          const newAcc = {
            id: accountId,
            email: cleanEmail,
            pin: cleanPin,
            managerName: authForm.managerName.trim(),
            clubName: authForm.clubName.trim(),
            favTeam: authForm.favTeam || 'nal'
          };
          setAccounts(prev => [...prev.filter(a => a.id !== accountId), newAcc]);
          if (cloudServices.isCloud && cloudServices.db && user) {
            try {
              const sdk = window.__FPC_FIREBASE_SDK__;
              await sdk.setDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_accounts', accountId), newAcc);
            } catch (e) {}
          }
          if (targetLeague) {
            await enrollManagerInLeague(newAcc, targetLeague);
            setCurrentLeagueId(targetLeague.id);
          }
          setActiveAccount(newAcc);
          showNotification(`¡Bienvenido DT ${newAcc.managerName}!`);
        } else {
          const found = accounts.find(a => a.email === cleanEmail && a.pin === cleanPin);
          if (!found) {
            showNotification('Usuario o PIN incorrecto.', 'error');
            return;
          }
          if (targetLeague) {
            await enrollManagerInLeague(found, targetLeague);
            setCurrentLeagueId(targetLeague.id);
          } else if (!currentLeagueId) {
            const myFirstMember = members.find(m => m.userId === found.id);
            if (myFirstMember) setCurrentLeagueId(myFirstMember.leagueId);
          }
          setActiveAccount(found);
          showNotification(`¡Bienvenido de nuevo, DT ${found.managerName}!`);
        }
      };

      const handleSetCaptain = async (playerId) => {
        if (!activeAccount || !myMemberProfile || !currentLeagueId) return;
        if (!(myMemberProfile.lineup || []).includes(playerId)) {
          showNotification('El Capitán debe estar en tu 11 titular.', 'error');
          return;
        }
        const memberId = `${currentLeagueId}_${activeAccount.id}`;
        setMembers(prev => prev.map(m => m.id === memberId ? { ...m, captainId: playerId } : m));
        if (cloudServices.isCloud && cloudServices.db && user) {
          try {
            const sdk = window.__FPC_FIREBASE_SDK__;
            await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_members', memberId), { captainId: playerId });
          } catch (e) {}
        }
        const pl = enrichedPlayers.find(p => p.id === playerId);
        showNotification(`©️ ${pl?.name || 'Jugador'} es tu nuevo Capitán (Puntuará x2).`);
      };

      const handleChangeFormation = async (newForm) => {
        if (!FORMATIONS[newForm] || !myMemberProfile || !currentLeagueId || !activeAccount) return;
        const spec = FORMATIONS[newForm];
        const currentStarters = mySquadPlayers.filter(p => (myMemberProfile.lineup || []).includes(p.id));
        const nextLineup = [
          ...currentStarters.filter(p => p.pos === 'POR').slice(0, spec.POR).map(p => p.id),
          ...currentStarters.filter(p => p.pos === 'DEF').slice(0, spec.DEF).map(p => p.id),
          ...currentStarters.filter(p => p.pos === 'MED').slice(0, spec.MED).map(p => p.id),
          ...currentStarters.filter(p => p.pos === 'DEL').slice(0, spec.DEL).map(p => p.id)
        ];
        const memberId = `${currentLeagueId}_${activeAccount.id}`;
        setMembers(prev => prev.map(m => m.id === memberId ? { ...m, formation: newForm, lineup: nextLineup } : m));
        if (cloudServices.isCloud && cloudServices.db && user) {
          try {
            const sdk = window.__FPC_FIREBASE_SDK__;
            await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_members', memberId), { formation: newForm, lineup: nextLineup });
          } catch (e) {}
        }
        showNotification(`Esquema táctico actualizado a ${newForm}`);
      };

      const handleToggleLineup = async (playerId) => {
        if (!activeAccount || !myMemberProfile || !currentLeagueId) return;
        const player = enrichedPlayers.find(p => p.id === playerId);
        if (!player) return;

        const currentLineup = myMemberProfile.lineup || [];
        const isStarter = currentLineup.includes(playerId);
        const changesUsed = myMemberProfile.changesUsedThisMatchday || 0;

        let newLineup;
        let nextChangesUsed = changesUsed;

        if (isStarter) {
          newLineup = currentLineup.filter(id => id !== playerId);
        } else {
          const samePosStarters = mySquadPlayers.filter(p => currentLineup.includes(p.id) && p.pos === player.pos);
          const maxForPos = formationSpec[player.pos] || 0;
          if (samePosStarters.length >= maxForPos) {
            showNotification(`Tu formación ${activeFormation} ya tiene los ${maxForPos} ${player.pos} completos.`, 'error');
            return;
          }
          newLineup = [...currentLineup, playerId];
          nextChangesUsed = changesUsed + 1;
        }

        const myMemberId = `${currentLeagueId}_${activeAccount.id}`;
        setMembers(prev => prev.map(m => m.id === myMemberId ? { ...m, lineup: newLineup, changesUsedThisMatchday: nextChangesUsed } : m));
        if (cloudServices.isCloud && cloudServices.db && user) {
          try {
            const sdk = window.__FPC_FIREBASE_SDK__;
            await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_members', myMemberId), {
              lineup: newLineup, changesUsedThisMatchday: nextChangesUsed
            });
          } catch (e) {}
        }
        showNotification(isStarter ? `${player.name} pasó a la banca.` : `✅ ${player.name} entró al 11 titular.`);
      };

      const activeAuctions = useMemo(() => currentLeague?.activeAuctions || {}, [currentLeague]);

      const handlePlaceAuctionBid = async (player, rawBidAmount) => {
        if (!activeAccount || !myMemberProfile || !currentLeague) return;
        const bidAmount = rawBidAmount ? Number(rawBidAmount) : player.value;
        const currentOwner = playerOwnerMap[player.id];
        if (currentOwner) {
          showNotification(`Este jugador ya pertenece a ${currentOwner.managerName}.`, 'error');
          return;
        }
        if ((myMemberProfile.squad || []).length >= MAX_SQUAD_SIZE) {
          showNotification(`Tienes el tope de ${MAX_SQUAD_SIZE} jugadores en plantilla.`, 'error');
          return;
        }
        const existingBid = activeAuctions[player.id];
        const minRequiredBid = existingBid ? existingBid.amount + 100000 : player.value;
        if (bidAmount < minRequiredBid) {
          showNotification(`Puja mínima requerida: ${formatCOP(minRequiredBid)}`, 'error');
          return;
        }

        const updatedAuctions = {
          ...activeAuctions,
          [player.id]: {
            playerId: player.id,
            amount: bidAmount,
            bidderUserId: activeAccount.id,
            bidderMemberId: myMemberProfile.id,
            bidderName: activeAccount.managerName,
            clubName: activeAccount.clubName,
            timestamp: Date.now()
          }
        };
        const bidLog = `🔨 ${activeAccount.managerName} pujó ${formatCOP(bidAmount)} por ${player.name}.`;

        setLeagues(prev => prev.map(l => l.id === currentLeague.id ? { ...l, activeAuctions: updatedAuctions, lastLogs: [bidLog, ...(l.lastLogs || []).slice(0, 14)] } : l));
        if (cloudServices.isCloud && cloudServices.db && user) {
          try {
            const sdk = window.__FPC_FIREBASE_SDK__;
            await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_leagues', currentLeague.id), {
              activeAuctions: updatedAuctions,
              lastLogs: [bidLog, ...(currentLeague.lastLogs || []).slice(0, 14)]
            });
          } catch (e) {}
        }
        showNotification(`¡Puja registrada por ${player.name} (${formatCOP(bidAmount)})!`);
      };

      const handleSettleDailyAuctionsAndRotateMarket = async (isAuto = false) => {
        if (!currentLeague) return;
        if (!isAuto && !isLeagueCreator) {
          showNotification('🔒 Solo el Creador de la liga puede forzar el cierre manual de la subasta.', 'error');
          return;
        }
        const auctionsList = Object.values(currentLeague.activeAuctions || {});
        const updatedMembersMap = {};
        leagueMembers.forEach(m => {
          updatedMembersMap[m.id] = { ...m, squad: [...(m.squad || [])], lineup: [...(m.lineup || [])] };
        });

        const occupiedPlayerIds = new Set(leagueMembers.flatMap(m => m.squad || []));
        const settlementLogs = [];

        auctionsList.forEach(auction => {
          const player = enrichedPlayers.find(p => p.id === auction.playerId);
          const winner = updatedMembersMap[auction.bidderMemberId];
          if (!player || !winner) return;
          if (occupiedPlayerIds.has(player.id) || winner.squad.length >= MAX_SQUAD_SIZE) return;

          winner.budget = (winner.budget || 0) - auction.amount;
          winner.squad.push(player.id);
          occupiedPlayerIds.add(player.id);

          const fName = winner.formation && FORMATIONS[winner.formation] ? winner.formation : '4-4-2';
          const spec = FORMATIONS[fName];
          const currentPosInLineup = winner.squad.map(id => enrichedPlayers.find(p => p.id === id)).filter(p => p && winner.lineup.includes(p.id) && p.pos === player.pos).length;
          if (currentPosInLineup < (spec[player.pos] || 0)) winner.lineup.push(player.id);

          settlementLogs.push(`🏆 Subasta adjudicada: ${player.name} fichado por ${winner.managerName} (${formatCOP(auction.amount)}).`);
        });

        const freeAgentsPool = INITIAL_PLAYERS.filter(p => !occupiedPlayerIds.has(p.id));
        const nextMarketIds = [...freeAgentsPool].sort(() => 0.5 - Math.random()).slice(0, 12).map(p => p.id);
        const todayKey = getColombianDateKey();
        const logMsg = `🌙 Cierre 11:59 PM: ${settlementLogs.length} fichajes adjudicados y 12 nuevos jugadores en subasta.`;

        setMembers(prev => prev.map(m => updatedMembersMap[m.id] ? updatedMembersMap[m.id] : m));
        setLeagues(prev => prev.map(l => l.id === currentLeague.id ? {
          ...l, marketPlayerIds: nextMarketIds, activeAuctions: {}, marketDateKey: todayKey,
          lastLogs: [logMsg, ...settlementLogs, ...(l.lastLogs || []).slice(0, 12)]
        } : l));

        if (cloudServices.isCloud && cloudServices.db && user) {
          try {
            const sdk = window.__FPC_FIREBASE_SDK__;
            for (const mId of Object.keys(updatedMembersMap)) {
              const mem = updatedMembersMap[mId];
              await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_members', mem.id), {
                budget: mem.budget, squad: mem.squad, lineup: mem.lineup
              });
            }
            await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_leagues', currentLeague.id), {
              marketPlayerIds: nextMarketIds, activeAuctions: {}, marketDateKey: todayKey,
              lastLogs: [logMsg, ...settlementLogs, ...(currentLeague.lastLogs || []).slice(0, 12)]
            });
          } catch (e) {}
        }
        if (!isAuto) showNotification('¡Subastas adjudicadas y mercado renovado!');
      };

      const handleSellPlayer = async (player) => {
        if (!activeAccount || !myMemberProfile || !currentLeagueId) return;
        const myMemberId = `${currentLeagueId}_${activeAccount.id}`;
        const updatedSquad = (myMemberProfile.squad || []).filter(id => id !== player.id);
        const updatedLineup = (myMemberProfile.lineup || []).filter(id => id !== player.id);

        setMembers(prev => prev.map(m => m.id === myMemberId ? { ...m, budget: m.budget + player.value, squad: updatedSquad, lineup: updatedLineup } : m));
        if (cloudServices.isCloud && cloudServices.db && user) {
          try {
            const sdk = window.__FPC_FIREBASE_SDK__;
            await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_members', myMemberId), {
              budget: myMemberProfile.budget + player.value, squad: updatedSquad, lineup: updatedLineup
            });
          } catch (e) {}
        }
        showNotification(`Vendiste a ${player.name} por ${formatCOP(player.value)}`);
      };

      const handlePayReleaseClause = async (player, rivalMember) => {
        if (!activeAccount || !myMemberProfile || !currentLeague || !rivalMember) return;
        const clausePrice = Math.round(player.value * 1.5);
        if ((myMemberProfile.budget || 0) < clausePrice) {
          showNotification(`Necesitas ${formatCOP(clausePrice)} en efectivo para pagar este clausulazo.`, 'error');
          return;
        }
        if ((myMemberProfile.squad || []).length >= MAX_SQUAD_SIZE) {
          showNotification(`Tu plantilla está llena (${MAX_SQUAD_SIZE}/20).`, 'error');
          return;
        }

        const myUpdatedSquad = [...(myMemberProfile.squad || []), player.id];
        const rivalUpdatedSquad = (rivalMember.squad || []).filter(id => id !== player.id);
        const rivalUpdatedLineup = (rivalMember.lineup || []).filter(id => id !== player.id);
        const clauseLog = `⚡ ¡CLAUSULAZO! ${activeAccount.managerName} pagó ${formatCOP(clausePrice)} a ${rivalMember.managerName} y le arrebató a ${player.name}.`;

        setMembers(prev => prev.map(m => {
          if (m.id === myMemberProfile.id) return { ...m, budget: m.budget - clausePrice, squad: myUpdatedSquad };
          if (m.id === rivalMember.id) return { ...m, budget: (m.budget || 0) + clausePrice, squad: rivalUpdatedSquad, lineup: rivalUpdatedLineup };
          return m;
        }));
        setLeagues(prev => prev.map(l => l.id === currentLeague.id ? { ...l, lastLogs: [clauseLog, ...(l.lastLogs || []).slice(0, 14)] } : l));

        if (cloudServices.isCloud && cloudServices.db && user) {
          try {
            const sdk = window.__FPC_FIREBASE_SDK__;
            await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_members', myMemberProfile.id), {
              budget: myMemberProfile.budget - clausePrice, squad: myUpdatedSquad
            });
            await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_members', rivalMember.id), {
              budget: (rivalMember.budget || 0) + clausePrice, squad: rivalUpdatedSquad, lineup: rivalUpdatedLineup
            });
            await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_leagues', currentLeague.id), {
              lastLogs: [clauseLog, ...(currentLeague.lastLogs || []).slice(0, 14)]
            });
          } catch (e) {}
        }
        setInspectingMember(null);
        showNotification(`¡Clausulazo exitoso! Fichaste a ${player.name}.`);
      };

      const inversePotPreview = useMemo(() => {
        const totalPot = Number(currentLeague?.matchdayPot) || 15000000;
        const count = Math.max(1, leagueMembers.length);
        const totalShares = (count * (count + 1)) / 2;
        return Array.from({ length: count }, (_, idx) => {
          const rankInMatchday = idx + 1;
          const rawShare = Math.round(((totalPot * rankInMatchday) / totalShares) / 100000) * 100000;
          return { rank: rankInMatchday, amount: rawShare };
        });
      }, [currentLeague?.matchdayPot, leagueMembers.length]);

      // LIQUIDACIÓN ÚNICA Y EXCLUSIVA DEL CREADOR (4 CAPAS DE SEGURIDAD)
      const handleSettleOfficialMatchday = async (matchdayKeyToSettle = selectedSettleMatchdayKey) => {
        if (!currentLeague || !activeAccount) return;

        // Capa 1: Solo el creador de la liga
        if (!isLeagueCreator) {
          showNotification('🔒 Acción restringida: Solo el Creador de la liga puede liquidar las fechas.', 'error');
          return;
        }

        // Capa 2: Solo jornadas con partidos finalizados
        if (!isMatchdayPlayableToSettle(matchdayKeyToSettle)) {
          showNotification('⏳ Esta fecha aún tiene partidos por jugarse y no puede liquidarse.', 'error');
          return;
        }

        // Capa 3: Verificación síncrona inmediata en Ref, LocalStorage y Estado
        const inMemList = settledInMemoryRef.current[currentLeague.id] || [];
        if (settledMatchdays.includes(matchdayKeyToSettle) || inMemList.includes(matchdayKeyToSettle) || isSettlingMatchday) {
          showNotification(`⚠️ La ${matchdayKeyToSettle.toUpperCase()} ya fue liquidada anteriormente. Solo se permite 1 vez.`, 'error');
          return;
        }

        // Bloqueo síncrono en 0ms antes de cualquier operación asíncrona
        settledInMemoryRef.current[currentLeague.id] = [...new Set([...inMemList, matchdayKeyToSettle])];
        setIsSettlingMatchday(true);
        setLocalSettledLock(prev => ({
          ...prev,
          [currentLeague.id]: [...new Set([...(prev[currentLeague.id] || []), matchdayKeyToSettle])]
        }));

        try {
          // Capa 4: Verificación contra Firebase en vivo antes de sumar
          if (cloudServices.isCloud && cloudServices.db && user) {
            try {
              const sdk = window.__FPC_FIREBASE_SDK__;
              const liveSnap = await sdk.getDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_leagues', currentLeague.id));
              if (liveSnap.exists()) {
                const liveData = liveSnap.data();
                const remoteSettled = Array.isArray(liveData.settledMatchdays) ? liveData.settledMatchdays : [];
                const remoteLogs = Array.isArray(liveData.lastLogs) ? liveData.lastLogs : [];
                const mdNum = matchdayKeyToSettle.replace('f', '');
                const alreadyInLogs = remoteLogs.some(l => typeof l === 'string' && l.includes(`Fecha ${mdNum} liquidada`));
                if (remoteSettled.includes(matchdayKeyToSettle) || alreadyInLogs) {
                  showNotification(`⚠️ La Fecha ${mdNum} ya consta como liquidada en la nube.`, 'error');
                  return;
                }
              }
            } catch (e) {}
          }

          const mdLabel = matchdayKeyToSettle === 'f15' ? 'Fecha 15' : matchdayKeyToSettle === 'f16' ? 'Fecha 16' : 'Fecha 17';
          const scoreIndexOffset = matchdayKeyToSettle === 'f15' ? 4 : matchdayKeyToSettle === 'f16' ? 3 : 2;

          const scoredMembers = leagueMembers.map(m => {
            if ((m.budget || 0) < 0) return { ...m, calculatedWeekPts: 0 };
            const fName = m.formation && FORMATIONS[m.formation] ? m.formation : '4-4-2';
            const spec = FORMATIONS[fName];
            const memberSquadObjs = (m.squad || []).map(id => enrichedPlayers.find(p => p.id === id)).filter(Boolean);
            const starters = memberSquadObjs.filter(p => (m.lineup || []).includes(p.id));

            const validPOR = starters.filter(p => p.pos === 'POR').slice(0, spec.POR);
            const validDEF = starters.filter(p => p.pos === 'DEF').slice(0, spec.DEF);
            const validMED = starters.filter(p => p.pos === 'MED').slice(0, spec.MED);
            const validDEL = starters.filter(p => p.pos === 'DEL').slice(0, spec.DEL);
            const validStarters = [...validPOR, ...validDEF, ...validMED, ...validDEL];

            let rawPts = 0;
            validStarters.forEach(pl => {
              const pScore = pl.last5?.[scoreIndexOffset] ?? pl.last5?.[pl.last5.length - 1] ?? 6;
              rawPts += m.captainId === pl.id ? pScore * 2 : pScore;
            });

            const emptyCount =
              Math.max(0, spec.POR - validPOR.length) +
              Math.max(0, spec.DEF - validDEF.length) +
              Math.max(0, spec.MED - validMED.length) +
              Math.max(0, spec.DEL - validDEL.length);

            return { ...m, calculatedWeekPts: rawPts + (emptyCount * -4) };
          });

          const sortedByMatchdayDesc = [...scoredMembers].sort((a, b) => b.calculatedWeekPts - a.calculatedWeekPts);
          const totalPot = Number(currentLeague.matchdayPot) || 15000000;
          const n = Math.max(1, sortedByMatchdayDesc.length);
          const totalShares = (n * (n + 1)) / 2;

          const updatedMembers = sortedByMatchdayDesc.map((m, idx) => {
            const matchdayRank = idx + 1;
            const potReward = Math.round(((totalPot * matchdayRank) / totalShares) / 100000) * 100000;
            return {
              ...m,
              points: (m.points || 0) + m.calculatedWeekPts,
              lastMatchdayPoints: m.calculatedWeekPts,
              lastMatchdayRank: matchdayRank,
              lastPotReward: potReward,
              budget: (m.budget || 0) + potReward,
              changesUsedThisMatchday: 0
            };
          });

          const nextSettledList = [...new Set([...settledMatchdays, matchdayKeyToSettle])];
          const numericMd = Number(matchdayKeyToSettle.replace('f', '')) || 15;
          const logMsg = `💰 ${mdLabel} liquidada oficialmente por el creador ${activeAccount.managerName} (Capitán x2). Pozo inverso de ${formatCOP(totalPot)} abonado. (Liquidación única bloqueada).`;

          setMembers(prev => prev.map(m => updatedMembers.find(u => u.id === m.id) || m));
          setLeagues(prev => prev.map(l => l.id === currentLeague.id ? {
            ...l,
            matchday: numericMd,
            settledMatchdays: nextSettledList,
            lastLogs: [logMsg, ...(l.lastLogs || []).slice(0, 14)]
          } : l));

          if (cloudServices.isCloud && cloudServices.db && user) {
            try {
              const sdk = window.__FPC_FIREBASE_SDK__;
              await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_leagues', currentLeague.id), {
                matchday: numericMd,
                settledMatchdays: nextSettledList,
                lastLogs: [logMsg, ...(currentLeague.lastLogs || []).slice(0, 14)]
              });
              for (const mem of updatedMembers) {
                await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_members', mem.id), {
                  points: mem.points, lastMatchdayPoints: mem.lastMatchdayPoints, lastMatchdayRank: mem.lastMatchdayRank,
                  lastPotReward: mem.lastPotReward, budget: mem.budget, changesUsedThisMatchday: 0
                });
              }
            } catch (e) {}
          }
          showNotification(`¡${mdLabel} liquidada por única vez! Ya quedó bloqueada permanentemente.`);
        } finally {
          setIsSettlingMatchday(false);
        }
      };

      const handleSendChatMessage = async (e) => {
        e.preventDefault();

        if (cloudServices.isCloud && cloudServices.db && user) {

            const sdk = window.__FPC_FIREBASE_SDK__;

        setLeagues(prev => [...prev, newLeague]);
        setMembers(prev => [...prev, founderMember]);

        if (cloudServices.isCloud && cloudServices.db && user) {
          try {
            const sdk = window.__FPC_FIREBASE_SDK__;

            await sdk.setDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_members', founderMember.id), founderMember);

        setNewLeagueName('');
        setShowCreateLeagueModal(false);
        showNotification(`¡Liga "${newLeague.name}" creada con éxito!`);

      const handleJoinLeagueByObject = async (targetLeague) => {

                    ⚽
                  </div>

                </div>

                <div className="grid grid-cols-2 gap-2 bg-slate-100 p-1.5 rounded-2xl mb-5">
                  <button type="button" onClick={() => setAuthMode('register')} className={`py-2.5 rounded-xl text-xs font-extrabold transition cursor-pointer ${authMode === 'register' ? 'bg-emerald-600 text-white shadow' : 'text-slate-600'}`}>Crear Cuenta</button>
                  <button type="button" onClick={() => setAuthMode('login')} className={`py-2.5 rounded-xl text-xs font-extrabold transition cursor-pointer ${authMode === 'login' ? 'bg-emerald-600 text-white shadow' : 'text-slate-600'}`}>Iniciar Sesión</button>
                </div>

                <form onSubmit={handleAuthSubmit} className="space-y-3.5">
                  {authMode === 'register' && (
                    <>
                      <div className="grid grid-cols-2 gap-2.5">
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">Nombre DT *</label>
                          <input type="text" required value={authForm.managerName} onChange={e => setAuthForm({ ...authForm, managerName: e.target.value })} placeholder="Ej. Luis G" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-900 font-semibold" />

                        <label className="block text-xs font-bold text-slate-700 mb-1">Equipo Favorito FPC</label>

                      <input type="text" required value={authForm.email} onChange={e => setAuthForm({ ...authForm, email: e.target.value })} placeholder="luis" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-900 font-semibold" />

                      <input type="password" required value={authForm.pin} onChange={e => setAuthForm({ ...authForm, pin: e.target.value })} placeholder="••••" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-900 font-semibold" />

          {/* Header estilo Biwenger */}
          <header className="bg-gradient-to-r from-emerald-700 via-emerald-600 to-green-600 text-white sticky top-0 z-30 shadow-md">

                <p className="text-sm text-slate-600">Crea una liga para jugar con tus amigos o únete con el código de invitación.</p>
                <div className="flex flex-col sm:flex-row justify-center gap-3">

                                <td className="py-2 px-1 text-center">{t.pj}</td>
                                <td className="py-2 px-1 text-center font-bold">{t.gd}</td>
                                <td className="py-2 px-2 text-center font-black text-slate-900">{t.pts2026}</td>
                                <td className="py-2 px-1">
                                  <div className="flex justify-center gap-0.5">
                                    {t.form.map((f, i) => (
                                      <span key={i} className={`w-4 h-4 rounded text-[9px] font-black text-white flex items-center justify-center ${f === 'G' ? 'bg-emerald-500' : f === 'E' ? 'bg-amber-500' : 'bg-rose-500'}`}>{f}</span>
                                    ))}
                                  </div>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'database' && (
                  <div className="space-y-4">
                    <div className="bw-card border rounded-2xl p-4 flex flex-wrap items-center gap-3">
                      <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="Buscar jugador..." className="flex-1 min-w-[200px] bw-subcard border rounded-xl px-4 py-2 text-sm text-slate-900 font-medium" />
                      <select value={selectedTeamFilter} onChange={e => setSelectedTeamFilter(e.target.value)} className="bw-subcard border rounded-xl px-3 py-2 text-xs font-bold text-slate-800">
                        <option value="ALL">Todos los Clubes (20)</option>
                        {FPC_TEAMS.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                      </select>
                      <div className="flex gap-1">
                        {['ALL', 'POR', 'DEF', 'MED', 'DEL'].map(pos => (
                          <button key={pos} onClick={() => setSelectedPosFilter(pos)} className={`px-3 py-1.5 rounded-xl text-xs font-black cursor-pointer ${selectedPosFilter === pos ? 'bg-emerald-600 text-white' : 'bw-subcard border text-slate-600'}`}>
                            {pos === 'ALL' ? 'Todos' : pos}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                      {filteredDatabasePlayers.map(player => {
                        const team = getTeamById(player.teamId);
                        const owner = playerOwnerMap[player.id];
                        return (
                          <div key={player.id} onClick={() => setSelectedPlayerModal(player)} className="bw-card border rounded-2xl p-4 cursor-pointer hover:border-emerald-500 transition flex flex-col justify-between">
                            <div className="flex items-start justify-between gap-2">
                              <div className="flex items-center gap-3">
                                <PlayerAvatar player={player} size="md" showBadge={true} />
                                <div>
                                  <div className="flex items-center gap-1.5">
                                    <span className={`text-[10px] font-black px-2 py-0.5 rounded ${getPosColor(player.pos)}`}>{player.pos}</span>
                                    <h3 className="text-sm font-black text-slate-900">{player.name}</h3>
                                  </div>
                                  <span className="text-[11px] font-bold text-slate-500">{team.name} • {formatCOP(player.value)}</span>
                                </div>
                              </div>
                              <span className="text-xs font-black text-emerald-700 bg-emerald-50 px-2 py-1 rounded-lg">{player.points} pts</span>
                            </div>
                            <div className="mt-3 pt-2.5 border-t border-slate-100 flex items-center justify-between text-xs">
                              <Last5Boxes scores={player.last5} size="xs" />
                              <span className="font-bold text-slate-500">{owner ? `👤 ${owner.managerName}` : 'Libre'}</span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {activeTab === 'rules' && (
                  <div className="bw-card border rounded-2xl p-6 max-w-2xl mx-auto space-y-3 text-xs text-slate-600">
                    <h2 className="text-lg font-black text-slate-900">Reglamento Oficial FPC Biwenger</h2>
                    <p>• <strong>Posiciones Vacías Interactivas:</strong> Si tienes un hueco vacío en tu cancha, haz clic sobre el círculo rojo para abrir la lista de suplentes de esa línea y alinearlo de inmediato.</p>
                    <p>• <strong>Liquidación Única por Fecha (Solo Creador):</strong> Cada jornada solo puede liquidarse una sola vez y únicamente por el fundador de la liga.</p>
                    <p>• <strong>Capitán (Puntos x2):</strong> El jugador que marques con la <strong>C</strong> duplica su puntuación en la fecha.</p>
                    <p>• <strong>Clausulazos (150%):</strong> Puedes fichar al instante a un jugador de un rival pagando su cláusula de rescisión desde la tabla de clasificación.</p>
                  </div>
                )}
              </>
            )}
          </main>

          {/* MODAL SELECTOR DE BANCA AL HACER CLIC EN UNA POSICIÓN VACÍA DE LA CANCHA */}
          {emptySlotPickerPos && (
            <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bw-card border rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl max-h-[85vh] flex flex-col">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <span className={`text-xs font-black px-2.5 py-1 rounded-lg ${getPosColor(emptySlotPickerPos)}`}>{emptySlotPickerPos}</span>
                    <div>
                      <h3 className="text-base font-black text-slate-900">
                        Elegir {emptySlotPickerPos === 'POR' ? 'Portero' : emptySlotPickerPos === 'DEF' ? 'Defensa' : emptySlotPickerPos === 'MED' ? 'Mediocampista' : 'Delantero'} de tu Banca
                      </h3>
                      <p className="text-[11px] text-slate-500">Selecciona un suplente disponible para cubrir esta posición</p>
                    </div>
                  </div>
                  <button onClick={() => setEmptySlotPickerPos(null)} className="text-slate-400 hover:text-slate-700 font-bold cursor-pointer">✕</button>
                </div>

                <div className="flex-1 overflow-y-auto space-y-2 pr-1">
                  {lineupByPos.bench.filter(p => p.pos === emptySlotPickerPos).length === 0 ? (
                    <div className="bw-subcard border rounded-2xl p-5 text-center space-y-3">
                      <p className="text-xs font-bold text-slate-600">
                        No tienes jugadores suplentes en tu banca de la línea <strong>{emptySlotPickerPos}</strong>.
                      </p>
                      <div className="flex flex-col sm:flex-row gap-2 justify-center">
                        <button
                          onClick={() => { setEmptySlotPickerPos(null); setActiveTab('market'); }}
                          className="px-4 py-2.5 rounded-xl bg-emerald-600 text-white font-black text-xs cursor-pointer shadow"
                        >
                          🔨 Ir al Mercado de Fichajes
                        </button>
                        <button
                          onClick={() => setEmptySlotPickerPos(null)}
                          className="px-4 py-2.5 rounded-xl bg-slate-200 text-slate-700 font-bold text-xs cursor-pointer"
                        >
                          Cerrar
                        </button>
                      </div>
                    </div>
                  ) : (
                    lineupByPos.bench.filter(p => p.pos === emptySlotPickerPos).map(p => (
                      <div key={p.id} className="bw-subcard border rounded-2xl p-3 flex items-center justify-between gap-2 hover:border-emerald-500 transition">
                        <div className="flex items-center gap-2.5 min-w-0">
                          <PlayerAvatar player={p} size="sm" showBadge={true} />
                          <div className="min-w-0">
                            <div className="text-xs font-black text-slate-900 truncate">{p.name}</div>
                            <div className="flex items-center gap-2 mt-0.5">
                              <span className="text-[10px] font-bold text-slate-500">{getTeamById(p.teamId).short} • {formatCOP(p.value)}</span>
                              <Last5Boxes scores={p.last5} size="xs" />
                            </div>
                          </div>
                        </div>
                        <button
                          onClick={() => { handleToggleLineup(p.id); setEmptySlotPickerPos(null); }}
                          className="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs cursor-pointer shadow shrink-0"
                        >
                          + Meter al 11
                        </button>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Modal Detalle de Jugador */}
          {selectedPlayerModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bw-card border rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-start justify-between">
                  <div className="flex items-center gap-3.5">
                    <PlayerAvatar player={selectedPlayerModal} size="lg" showBadge={true} />
                    <div>
                      <div className="flex items-center gap-1.5">
                        <span className={`text-[10px] font-black px-2 py-0.5 rounded ${getPosColor(selectedPlayerModal.pos)}`}>{selectedPlayerModal.pos}</span>
                        <h3 className="text-lg font-black text-slate-900">{selectedPlayerModal.name}</h3>
                      </div>
                      <p className="text-xs font-bold text-slate-500 mt-0.5">{getTeamById(selectedPlayerModal.teamId).name} • Dorsal #{selectedPlayerModal.dorsal}</p>
                      <div className="mt-1.5"><Last5Boxes scores={selectedPlayerModal.last5} size="sm" /></div>
                    </div>
                  </div>
                  <button onClick={() => setSelectedPlayerModal(null)} className="text-slate-400 font-bold cursor-pointer">✕</button>
                </div>

                <div className="grid grid-cols-3 gap-2 bw-subcard border p-3 rounded-2xl text-center text-xs">
                  <div><span className="text-[10px] text-slate-500 block">Valor</span><span className="font-black text-slate-900">{formatCOP(selectedPlayerModal.value)}</span></div>
                  <div><span className="text-[10px] text-slate-500 block">Cláusula</span><span className="font-black text-rose-600">{formatCOP(Math.round(selectedPlayerModal.value * 1.5))}</span></div>
                  <div><span className="text-[10px] text-slate-500 block">Puntos</span><span className="font-black text-amber-600">{selectedPlayerModal.points} pts</span></div>
                </div>

                <div className="grid grid-cols-4 gap-2 bw-subcard border p-2.5 rounded-2xl text-center text-[11px]">
                  <div><span className="text-slate-400 block">Edad</span><strong className="text-slate-800">{selectedPlayerModal.age} años</strong></div>
                  <div><span className="text-slate-400 block">Altura</span><strong className="text-slate-800">{selectedPlayerModal.height}</strong></div>
                  <div><span className="text-slate-400 block">Goles</span><strong className="text-slate-800">⚽ {selectedPlayerModal.goals}</strong></div>
                  <div><span className="text-slate-400 block">Asist.</span><strong className="text-slate-800">👟 {selectedPlayerModal.assists}</strong></div>
                </div>

                <div className="flex gap-2">
                  {(myMemberProfile?.squad || []).includes(selectedPlayerModal.id) ? (
                    <>
                      <button onClick={() => { handleToggleLineup(selectedPlayerModal.id); setSelectedPlayerModal(null); }} className="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white font-black text-xs cursor-pointer">
                        {(myMemberProfile?.lineup || []).includes(selectedPlayerModal.id) ? 'Enviar a la Banca' : 'Meter al 11 Titular'}
                      </button>
                      {(myMemberProfile?.lineup || []).includes(selectedPlayerModal.id) && (
                        <button onClick={() => { handleSetCaptain(selectedPlayerModal.id); setSelectedPlayerModal(null); }} className="px-3 py-2.5 rounded-xl bg-amber-400 text-slate-950 font-black text-xs cursor-pointer">
                          ©️ Capitán
                        </button>
                      )}
                      <button onClick={() => { handleSellPlayer(selectedPlayerModal); setSelectedPlayerModal(null); }} className="px-3 py-2.5 rounded-xl bg-rose-100 text-rose-700 font-bold text-xs cursor-pointer">
                        Vender
                      </button>
                    </>
                  ) : (
                    <button onClick={() => setSelectedPlayerModal(null)} className="w-full py-2.5 rounded-xl bg-slate-200 text-slate-800 font-bold text-xs cursor-pointer">
                      Cerrar Ficha
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Modal Inspeccionar Plantilla Rival / Clausulazos */}
          {inspectingMember && (
            <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bw-card border rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl max-h-[85vh] flex flex-col">
                <div className="flex items-center justify-between">
                  <div>
                    <h3 className="text-lg font-black text-slate-900">{inspectingMember.clubName}</h3>
                    <p className="text-xs text-slate-500">DT: {inspectingMember.managerName} • Saldo: {formatCOP(inspectingMember.budget)}</p>
                  </div>
                  <button onClick={() => setInspectingMember(null)} className="text-slate-400 font-bold cursor-pointer">✕</button>
                </div>
                <div className="flex-1 overflow-y-auto space-y-2 pr-1">
                  {(inspectingMember.squad || []).map(pId => {
                    const p = enrichedPlayers.find(pl => pl.id === pId);
                    if (!p) return null;
                    const clauseCost = Math.round(p.value * 1.5);
                    return (
                      <div key={p.id} className="bw-subcard border rounded-xl p-2.5 flex items-center justify-between gap-2">
                        <div className="flex items-center gap-2.5">
                          <PlayerAvatar player={p} size="sm" showBadge={true} />
                          <div>
                            <div className="text-xs font-extrabold text-slate-900">{p.name}</div>
                            <div className="text-[10px] text-slate-500">{p.pos} • Cláusula: <strong className="text-rose-600">{formatCOP(clauseCost)}</strong></div>
                          </div>
                        </div>
                        {inspectingMember.userId !== activeAccount?.id && (
                          <button onClick={() => handlePayReleaseClause(p, inspectingMember)} className="px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-black text-[11px] cursor-pointer">
                            ⚡ Pagar {formatCOP(clauseCost)}
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* Modal Crear Liga */}
          {showCreateLeagueModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4">
              <form onSubmit={handleCreateLeague} className="bw-card border rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-black text-slate-900">Crear Nueva Liga</h3>
                  <button type="button" onClick={() => setShowCreateLeagueModal(false)} className="text-slate-400 font-bold cursor-pointer">✕</button>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Nombre de la Liga *</label>
                  <input type="text" required value={newLeagueName} onChange={e => setNewLeagueName(e.target.value)} placeholder="Ej. Liga Amigos FPC" className="w-full bw-subcard border rounded-xl px-3 py-2 text-sm text-slate-900 font-bold" />
                </div>
                <div className="grid grid-cols-2 gap-2.5">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Efectivo Inicial</label>
                    <select value={newLeagueInitialCash} onChange={e => setNewLeagueInitialCash(Number(e.target.value))} className="w-full bw-subcard border rounded-xl px-3 py-2 text-xs font-bold text-slate-900">
                      <option value={15000000}>$15M COP</option>
                      <option value={25000000}>$25M COP</option>
                      <option value={40000000}>$40M COP</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Pozo por Fecha</label>
                    <select value={newLeagueMatchdayPot} onChange={e => setNewLeagueMatchdayPot(Number(e.target.value))} className="w-full bw-subcard border rounded-xl px-3 py-2 text-xs font-bold text-slate-900">
                      <option value={15000000}>$15M COP</option>
                      <option value={25000000}>$25M COP</option>
                    </select>
                  </div>
                </div>
                <div className="flex justify-end gap-2">
                  <button type="button" onClick={() => setShowCreateLeagueModal(false)} className="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold text-slate-700 cursor-pointer">Cancelar</button>
                  <button type="submit" className="px-5 py-2 rounded-xl bg-emerald-600 text-white text-xs font-black cursor-pointer">Crear Liga</button>
                </div>
              </form>
            </div>
          )}

          {/* Modal Unirse a Liga */}
          {showJoinLeagueModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bw-card border rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-black text-slate-900">Unirse a una Liga</h3>
                  <button onClick={() => setShowJoinLeagueModal(false)} className="text-slate-400 font-bold cursor-pointer">✕</button>
                </div>
                <form onSubmit={async e => {
                  e.preventDefault();
                  const target = leagues.find(l => l.code?.toUpperCase() === joinCodeInput.trim().toUpperCase());
                  if (!target) { showNotification('Código de liga no encontrado', 'error'); return; }
                  await handleJoinLeagueByObject(target);
                }} className="flex gap-2">
                  <input type="text" required value={joinCodeInput} onChange={e => setJoinCodeInput(e.target.value.toUpperCase())} placeholder="Código Ej. ABC123" className="flex-1 bw-subcard border rounded-xl px-3.5 py-2 text-sm uppercase font-mono font-bold text-slate-900" />
                  <button type="submit" className="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-black cursor-pointer">Entrar</button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Confirmar Reinicio */}
          {leagueActionModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bw-card border rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <h3 className="text-lg font-black text-slate-900">🔄 ¿Reiniciar Liga de Cero?</h3>
                <p className="text-xs text-slate-600">Todos los puntos volverán a 0, se limpiará el historial de fechas liquidadas y se repartirán nuevas plantillas.</p>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setLeagueActionModal(null)} className="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold text-slate-700 cursor-pointer">Cancelar</button>
                  <button onClick={() => handleConfirmResetLeague(leagueActionModal.league)} className="px-4 py-2 rounded-xl bg-amber-500 text-slate-950 text-xs font-black cursor-pointer">Confirmar Reinicio</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
