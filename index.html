    const TEAM_BADGE_CACHE = (() => {
      try { return JSON.parse(localStorage.getItem('fpc_team_badges_v5') || '{}'); } catch { return {}; }

    const PENDING_BADGE_REQUESTS = {};

    const fetchOfficialTeamBadge = async (team) => {
      if (team.logo) return team.logo;
      if (TEAM_BADGE_CACHE[team.id]) return TEAM_BADGE_CACHE[team.id];
      if (PENDING_BADGE_REQUESTS[team.id]) return PENDING_BADGE_REQUESTS[team.id];

      PENDING_BADGE_REQUESTS[team.id] = (async () => {
        // 1. Buscar escudo oficial en TheSportsDB por nombre exacto del club
        try {
          const q = encodeURIComponent(team.sportsDbName || team.name);
          const res = await fetch(`https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t=${q}`);
          if (res.ok) {
            const data = await res.json();
            if (data?.teams?.length > 0) {
              const colTeam = data.teams.find(t => (t.strCountry || '').toLowerCase().includes('colombia')) || data.teams[0];
              const badge = colTeam.strBadge || colTeam.strLogo;
              if (badge) {
                TEAM_BADGE_CACHE[team.id] = badge;
                try { localStorage.setItem('fpc_team_badges_v5', JSON.stringify(TEAM_BADGE_CACHE)); } catch {}
                return badge;
              }
            }
          }
        } catch {}

        // 2. Respaldo en Wikipedia ES por título exacto del club
        try {
          const wq = encodeURIComponent(team.wikiTitle || team.name);
          const wRes = await fetch(`https://es.wikipedia.org/w/api.php?action=query&titles=${wq}&prop=pageimages&format=json&pithumbsize=250&origin=*`);
          if (wRes.ok) {
            const wData = await wRes.json();
            const pages = wData?.query?.pages || {};
            const first = Object.values(pages)[0];
            if (first?.thumbnail?.source) {
              TEAM_BADGE_CACHE[team.id] = first.thumbnail.source;
              try { localStorage.setItem('fpc_team_badges_v5', JSON.stringify(TEAM_BADGE_CACHE)); } catch {}
              return first.thumbnail.source;
            }
          }
        } catch {}

        return null;
      })();

      return PENDING_BADGE_REQUESTS[team.id];
    };

    // Buscador Multi-Respaldo de Fotos Reales (Wikipedia Exact Title + Wikipedia Search + TheSportsDB)
    const fetchPlayerPhotoOnline = async (playerName) => {
      if (PHOTO_MEMORY_CACHE[playerName]) return PHOTO_MEMORY_CACHE[playerName];
      if (PENDING_PHOTO_REQUESTS[playerName]) return PENDING_PHOTO_REQUESTS[playerName];

      PENDING_PHOTO_REQUESTS[playerName] = (async () => {
        // Fuente 1: Wikipedia en Español por Título Exacto (con redirecciones automáticas)
        try {
          const exactQuery = encodeURIComponent(playerName);
          const exactRes = await fetch(`https://es.wikipedia.org/w/api.php?action=query&titles=${exactQuery}&redirects=1&prop=pageimages&format=json&pithumbsize=300&origin=*`);
          if (exactRes.ok) {
            const exactData = await exactRes.json();
            const pages = exactData?.query?.pages || {};
            const firstPage = Object.values(pages)[0];
            if (firstPage?.thumbnail?.source) {
              savePhotoToCache(playerName, firstPage.thumbnail.source);
              return firstPage.thumbnail.source;
            }
          }
        } catch {}

        // Fuente 2: TheSportsDB API (Recortes PNG transparentes y fotos de perfil)
        try {
          const query = encodeURIComponent(playerName);
          const res = await fetch(`https://www.thesportsdb.com/api/v1/json/3/searchplayers.php?p=${query}`);
          if (res.ok) {
            const data = await res.json();
            if (data && Array.isArray(data.player) && data.player.length > 0) {
              const soccerPlayer = data.player.find(p => p.strSport === 'Soccer' && (p.strCutout || p.strThumb)) || data.player[0];
              const foundImg = soccerPlayer.strCutout || soccerPlayer.strThumb || soccerPlayer.strRender;
              if (foundImg) {
                savePhotoToCache(playerName, foundImg);
                return foundImg;
              }
            }
          }
        } catch {}

          const wikiQuery = encodeURIComponent(`${playerName} futbolista`);
          const wikiRes = await fetch(`https://es.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${wikiQuery}&gsrlimit=1&prop=pageimages&format=json&pithumbsize=300&origin=*`);

            if (firstPage?.thumbnail?.source) {
              savePhotoToCache(playerName, firstPage.thumbnail.source);
              return firstPage.thumbnail.source;
            }
          }
        } catch {}

        return null;
      })();

      return PENDING_PHOTO_REQUESTS[playerName];

          const hrs = String(Math.floor(diff / (1000 * 60 * 60))).padStart(2, '0');

      const parseFlexibleFirebaseConfig = (rawText) => {
        if (!rawText) return null;

        } catch {
          const extractField = (key) => {
            const regex = new RegExp(`${key}\\s*:\\s*["']([^"']+)["']`);
            const match = rawText.match(regex);
            return match ? match[1] : "";
          };
          const apiKey = extractField('apiKey');
          const projectId = extractField('projectId');
          if (!apiKey || !projectId) return null;
          return {
            apiKey,
            authDomain: extractField('authDomain'),
            projectId,
            storageBucket: extractField('storageBucket'),
            messagingSenderId: extractField('messagingSenderId'),
            appId: extractField('appId')
          };
        }

      const generateStarterSquadByBudget = (targetSquadBudget = 65000000, takenPlayerIds = []) => {
        const avgPerPlayer = Math.max(3500000, Math.floor(Number(targetSquadBudget) / 11));
        const maxIndividualValue = Math.min(14000000, Math.floor(avgPerPlayer * 1.45));

        const pickByPosition = (pos, count, currentChosen) => {
          let pool = INITIAL_PLAYERS.filter(
            p => p.pos === pos && !takenPlayerIds.includes(p.id) && !currentChosen.includes(p.id) && p.value <= maxIndividualValue
          );
          if (pool.length < count) {
            pool = INITIAL_PLAYERS.filter(
              p => p.pos === pos && !takenPlayerIds.includes(p.id) && !currentChosen.includes(p.id)
            );
          }
          const shuffled = [...pool].sort(() => 0.5 - Math.random());
          return shuffled.slice(0, count).map(p => p.id);
        };

        let chosen = [];
        chosen = [...chosen, ...pickByPosition('POR', 1, chosen)];
        chosen = [...chosen, ...pickByPosition('DEF', 4, chosen)];
        chosen = [...chosen, ...pickByPosition('MED', 4, chosen)];
        chosen = [...chosen, ...pickByPosition('DEL', 2, chosen)];
        return chosen;
      };

        const emptyPOR = Math.max(0, formationSpec.POR - porList.length);

        const emptyMED = Math.max(0, formationSpec.MED - medList.length);
        const emptyDEL = Math.max(0, formationSpec.DEL - delList.length);
        const totalEmptySlots = emptyPOR + emptyDEF + emptyMED + emptyDEL;

        return {

          emptyPOR, emptyDEF, emptyMED, emptyDEL, totalEmptySlots,

      const handleSettleDailyAuctionsAndRotateMarket = async (isAuto = false) => {
        if (!currentLeague) return;
        const auctionsList = Object.values(currentLeague.activeAuctions || {});
        const updatedMembersMap = {};
        leagueMembers.forEach(m => {
          updatedMembersMap[m.id] = { ...m, squad: [...(m.squad || [])], lineup: [...(m.lineup || [])] };
        });

        const occupiedPlayerIds = new Set(leagueMembers.flatMap(m => m.squad || []));
        const settlementLogs = [];

        auctionsList.forEach(auction => {
          const player = enrichedPlayers.find(p => p.id === auction.playerId);
          const winner = updatedMembersMap[auction.bidderMemberId];
          if (!player || !winner) return;
          if (occupiedPlayerIds.has(player.id) || winner.squad.length >= MAX_SQUAD_SIZE) return;

          winner.budget = (winner.budget || 0) - auction.amount;
          winner.squad.push(player.id);
          occupiedPlayerIds.add(player.id);

          const fName = winner.formation && FORMATIONS[winner.formation] ? winner.formation : '4-4-2';
          const spec = FORMATIONS[fName];
          const currentPosInLineup = winner.squad.map(id => enrichedPlayers.find(p => p.id === id)).filter(p => p && winner.lineup.includes(p.id) && p.pos === player.pos).length;
          if (currentPosInLineup < (spec[player.pos] || 0)) winner.lineup.push(player.id);

          settlementLogs.push(`✅ Fichaje Oficial: ${player.name} pasa a ${winner.managerName} por ${formatCOP(auction.amount)}.`);
        });

        const freeAgentsPool = INITIAL_PLAYERS.filter(p => !occupiedPlayerIds.has(p.id));
        const shuffledFree = [...freeAgentsPool].sort(() => 0.5 - Math.random());
        const nextMarketIds = shuffledFree.slice(0, 12).map(p => p.id);
        const todayKey = getColombianDateKey();

        const logMsg = `🌙 Cierre de Mercado (11:59 PM): ${settlementLogs.length} fichajes completados y 12 nuevos jugadores en subasta.`;

        return Array.from({ length: count }, (_, idx) => {
          const rankInMatchday = idx + 1;
          const weight = rankInMatchday;
          const rawShare = Math.round(((totalPot * weight) / totalShares) / 100000) * 100000;
          return { rank: rankInMatchday, amount: rawShare };

      const handleSettleOfficialMatchday15 = async () => {
        if (!currentLeague) return;
        const scoredMembers = leagueMembers.map(m => {
          if ((m.budget || 0) < 0) return { ...m, calculatedWeekPts: 0, inRedPenalty: true };
          const fName = m.formation && FORMATIONS[m.formation] ? m.formation : '4-4-2';
          const spec = FORMATIONS[fName];
          const memberSquadObjs = (m.squad || []).map(id => enrichedPlayers.find(p => p.id === id)).filter(Boolean);
          const starters = memberSquadObjs.filter(p => (m.lineup || []).includes(p.id));

          const validPOR = starters.filter(p => p.pos === 'POR').slice(0, spec.POR);
          const validDEF = starters.filter(p => p.pos === 'DEF').slice(0, spec.DEF);
          const validMED = starters.filter(p => p.pos === 'MED').slice(0, spec.MED);
          const validDEL = starters.filter(p => p.pos === 'DEL').slice(0, spec.DEL);
          const validStarters = [...validPOR, ...validDEF, ...validMED, ...validDEL];

          let rawPts = 0;
          validStarters.forEach(pl => {
            const pScore = pl.last5?.[pl.last5.length - 1] || 6;
            const isCap = m.captainId === pl.id;
            rawPts += isCap ? pScore * 2 : pScore;
          });

          const emptyCount =
            Math.max(0, spec.POR - validPOR.length) +
            Math.max(0, spec.DEF - validDEF.length) +
            Math.max(0, spec.MED - validMED.length) +
            Math.max(0, spec.DEL - validDEL.length);

          return { ...m, calculatedWeekPts: rawPts + (emptyCount * -4), inRedPenalty: false };
        });

        const sortedByMatchdayDesc = [...scoredMembers].sort((a, b) => b.calculatedWeekPts - a.calculatedWeekPts);
        const totalPot = Number(currentLeague.matchdayPot) || 25000000;
        const n = Math.max(1, sortedByMatchdayDesc.length);
        const totalShares = (n * (n + 1)) / 2;

        const updatedMembers = sortedByMatchdayDesc.map((m, idx) => {
          const matchdayRank = idx + 1;
          const potReward = Math.round(((totalPot * matchdayRank) / totalShares) / 100000) * 100000;

            ...m,
            points: (m.points || 0) + m.calculatedWeekPts,
            lastMatchdayPoints: m.calculatedWeekPts,
            lastMatchdayRank: matchdayRank,
            lastPotReward: potReward,
            budget: (m.budget || 0) + potReward,
            changesUsedThisMatchday: 0

                  </div>
                  <div>
                    <label className="block text-xs font-extrabold bw-text-muted mb-1">Efectivo para Fichar</label>
                    <select value={newLeagueInitialCash} onChange={e => setNewLeagueInitialCash(Number(e.target.value))} className="w-full bw-input border rounded-xl px-3 py-2 text-sm font-bold cursor-pointer">
                      <option value={15000000}>$15M COP</option>
                      <option value={25000000}>$25M COP</option>
                      <option value={40000000}>$40M COP</option>
                    </select>
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-extrabold bw-text-muted mb-1">Premio Pozo por Jornada</label>
                  <select value={newLeagueMatchdayPot} onChange={e => setNewLeagueMatchdayPot(Number(e.target.value))} className="w-full bw-input border rounded-xl px-3 py-2 text-sm font-bold cursor-pointer">
                    <option value={15000000}>$15M COP</option>
                    <option value={25000000}>$25M COP</option>
                    <option value={40000000}>$40M COP</option>
                  </select>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setShowCreateLeagueModal(false)} className="px-4 py-2 rounded-xl bw-subcard border text-xs font-bold cursor-pointer">Cancelar</button>
                  <button type="submit" className="px-5 py-2 rounded-xl bg-emerald-600 text-white text-xs font-black cursor-pointer shadow">Fundar Liga</button>
                </div>
              </form>
            </div>
          )}

          {showJoinLeagueModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bw-card border rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl max-h-[85vh] flex flex-col">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-black bw-text-main">Unirse a una Liga</h3>
                  <button onClick={() => setShowJoinLeagueModal(false)} className="bw-text-muted hover:text-rose-500 cursor-pointer font-bold">✕</button>
                </div>
                <form onSubmit={async e => {
                  e.preventDefault();
                  const target = leagues.find(l => l.code?.toUpperCase() === joinCodeInput.trim().toUpperCase());
                  if (!target) { showNotification('Código de liga no encontrado', 'error'); return; }
                  await handleJoinLeagueByObject(target);
                }} className="space-y-2">
                  <label className="block text-xs font-extrabold bw-text-muted">Ingresa el Código que te dio tu amigo:</label>
                  <div className="flex gap-2">
                    <input type="text" required value={joinCodeInput} onChange={e => setJoinCodeInput(e.target.value.toUpperCase())} placeholder="Ej. ABC123" className="flex-1 bw-input border rounded-xl px-3.5 py-2.5 text-sm uppercase font-mono font-bold" />
                    <button type="submit" className="px-5 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-black cursor-pointer shadow">Entrar</button>
                  </div>
                </form>

                <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex-1 overflow-y-auto space-y-2">
                  <h4 className="text-xs font-black uppercase bw-text-muted mb-2">Ligas Públicas Abiertas ({publicLeagues.length}):</h4>
                  {publicLeagues.length === 0 ? (
                    <p className="text-xs bw-text-muted">No hay ligas públicas disponibles aún. ¡Crea la primera!</p>
                  ) : (
                    publicLeagues.map(l => (
                      <div key={l.id} className="bw-subcard border rounded-2xl p-3 flex items-center justify-between">
                        <div>
                          <div className="text-sm font-black bw-text-main">{l.name}</div>
                          <div className="text-xs bw-text-muted">DT Creador: {l.creatorName} • Código: <span className="font-mono text-emerald-600 font-bold">#{l.code}</span></div>
                        </div>
                        <button onClick={() => handleJoinLeagueByObject(l)} className="px-3.5 py-1.5 rounded-xl bg-emerald-600 text-white font-black text-xs cursor-pointer shadow">Unirme</button>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {inspectingMember && (
            <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bw-card border rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl max-h-[85vh] flex flex-col">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <TeamCrest teamId={inspectingMember.favTeam || 'buc'} size="sm" />
                    <div>
                      <h3 className="text-lg font-black bw-text-main">{inspectingMember.clubName}</h3>
                      <p className="text-xs bw-text-muted font-semibold">DT: {inspectingMember.managerName} • Táctica: {inspectingMember.formation || '4-4-2'} • Saldo: {formatCOP(inspectingMember.budget || 0)}</p>
                    </div>
                  </div>
                  <button onClick={() => setInspectingMember(null)} className="bw-text-muted hover:text-rose-500 cursor-pointer font-bold">✕</button>
                </div>
                <div className="flex-1 overflow-y-auto space-y-2 pr-1">
                  {(inspectingMember.squad || []).map(pId => {
                    const p = enrichedPlayers.find(pl => pl.id === pId);
                    if (!p) return null;
                    const isStarter = (inspectingMember.lineup || []).includes(p.id);
                    const isOtherManager = inspectingMember.userId !== activeAccount?.id;
                    return (
                      <div key={p.id} className="bw-subcard border rounded-2xl p-3 flex items-center justify-between gap-2">
                        <div className="flex items-center gap-2.5">
                          <PlayerAvatar player={p} size="sm" showBadge={true} isCaptain={inspectingMember.captainId === p.id} />
                          <div>
                            <div className="flex items-center gap-1.5">
                              <span className={`text-[9px] font-black px-1.5 py-0.5 rounded ${getPosColor(p.pos)}`}>{p.pos}</span>
                              <span className="text-xs font-black bw-text-main">{p.name}</span>
                            </div>
                            <span className="text-[10px] bw-text-muted font-bold">Valor: {formatCOP(p.value)} • ★{p.sofaRating}</span>
                          </div>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className={`text-[10px] font-black px-2 py-0.5 rounded-lg ${isStarter ? 'bg-emerald-500/15 text-emerald-600' : 'bw-card bw-text-muted'}`}>
                            {isStarter ? 'Titular' : 'Suplente'}
                          </span>
                          {isOtherManager && (
                            <button
                              onClick={() => handlePayReleaseClause(p, inspectingMember)}
                              className="px-2.5 py-1 rounded-xl bg-rose-500 hover:bg-rose-600 text-white font-black text-[10px] cursor-pointer shadow"
                            >
                              ⚡ Cláusula {formatCOP(p.clause)}
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {selectedMatchModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bw-card border rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl max-h-[85vh] flex flex-col">
                <div className="flex items-start justify-between">
                  <div>
                    <h3 className="text-lg font-black bw-text-main">{getTeamById(selectedMatchModal.home).name} vs {getTeamById(selectedMatchModal.away).name}</h3>
                    <p className="text-xs bw-text-muted font-semibold">{selectedMatchModal.date} • {selectedMatchModal.status}</p>
                  </div>
                  <button onClick={() => setSelectedMatchModal(null)} className="bw-text-muted hover:text-rose-500 text-sm font-bold cursor-pointer">✕</button>
                </div>
                <div className="bw-subcard p-3.5 rounded-2xl border text-center">
                  <div className="text-2xl font-black text-emerald-600">{selectedMatchModal.score}</div>
                  <div className="text-xs bw-text-muted font-semibold mt-1">{selectedMatchModal.highlights}</div>
                </div>
                <div className="flex-1 overflow-y-auto space-y-3 text-xs">
                  <h4 className="font-black text-emerald-600 uppercase">Propietarios en tu Liga:</h4>
                  <div className="grid grid-cols-2 gap-3">
                    <div className="bw-subcard p-3 rounded-2xl border space-y-1.5">
                      <div className="font-black bw-text-main border-b border-slate-200 dark:border-slate-800 pb-1">{getTeamById(selectedMatchModal.home).name}</div>
                      {enrichedPlayers.filter(p => p.teamId === selectedMatchModal.home).slice(0, 9).map(p => {
                        const owner = playerOwnerMap[p.id];
                        return (
                          <div key={p.id} className="flex justify-between items-center text-[11px]">
                            <span className="bw-text-main font-semibold truncate pr-1">{p.name}</span>
                            <span className="font-black text-emerald-600 shrink-0">{owner ? `👤 ${owner.managerName}` : 'Libre'}</span>
                          </div>
                        );
                      })}
                    </div>
                    <div className="bw-subcard p-3 rounded-2xl border space-y-1.5">
                      <div className="font-black bw-text-main border-b border-slate-200 dark:border-slate-800 pb-1">{getTeamById(selectedMatchModal.away).name}</div>
                      {enrichedPlayers.filter(p => p.teamId === selectedMatchModal.away).slice(0, 9).map(p => {
                        const owner = playerOwnerMap[p.id];
                        return (
                          <div key={p.id} className="flex justify-between items-center text-[11px]">
                            <span className="bw-text-main font-semibold truncate pr-1">{p.name}</span>
                            <span className="font-black text-emerald-600 shrink-0">{owner ? `👤 ${owner.managerName}` : 'Libre'}</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {selectedPlayerModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bw-card border rounded-3xl max-w-md w-full p-6 shadow-2xl">
                <div className="flex items-start justify-between">
                  <div className="flex items-center gap-3.5">
                    <PlayerAvatar player={selectedPlayerModal} size="lg" showBadge={true} isCaptain={myMemberProfile?.captainId === selectedPlayerModal.id} />
                    <div>
                      <div className="flex items-center gap-1.5 flex-wrap">
                        <span className={`text-[10px] font-black px-2 py-0.5 rounded-md ${getPosColor(selectedPlayerModal.pos)}`}>{selectedPlayerModal.pos}</span>
                        <span className="text-[10px] font-black px-2 py-0.5 rounded-md bw-subcard border bw-text-main">#{selectedPlayerModal.shirtNumber || 10}</span>
                        <h3 className="text-xl font-black bw-text-main">{selectedPlayerModal.name}</h3>
                      </div>
                      <div className="flex items-center gap-1.5 mt-1 flex-wrap">
                        <TeamCrest teamId={selectedPlayerModal.teamId} size="xs" />
                        <p className="text-xs font-bold bw-text-muted">{getTeamById(selectedPlayerModal.teamId).name}</p>
                        <span className="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-600 font-black">{selectedPlayerModal.role || 'Titular'}</span>
                      </div>
                    </div>
                  </div>
                  <button onClick={() => setSelectedPlayerModal(null)} className="bw-text-muted hover:text-rose-500 text-sm font-bold cursor-pointer">✕</button>
                </div>

                {/* Ficha Biográfica Completa del Jugador */}
                <div className="grid grid-cols-4 gap-1.5 mt-3 bw-subcard p-2.5 rounded-2xl border text-center text-[11px]">
                  <div><span className="text-[9px] bw-text-muted font-bold block uppercase">Edad</span><span className="font-black bw-text-main">{selectedPlayerModal.age || 26} años</span></div>
                  <div><span className="text-[9px] bw-text-muted font-bold block uppercase">Altura</span><span className="font-black bw-text-main">{selectedPlayerModal.height || '1.80 m'}</span></div>
                  <div><span className="text-[9px] bw-text-muted font-bold block uppercase">Pie Hábil</span><span className="font-black bw-text-main">{selectedPlayerModal.foot || 'Derecho'}</span></div>
                  <div><span className="text-[9px] bw-text-muted font-bold block uppercase">Minutos</span><span className="font-black text-emerald-600">{selectedPlayerModal.minutesPlayed || 1150}'</span></div>
                </div>

                <div className="mt-2.5 flex items-center justify-between bw-subcard border px-3.5 py-2 rounded-2xl">
                  <span className="text-xs font-extrabold bw-text-muted">Puntos últimas 5 fechas:</span>
                  <Last5Boxes scores={selectedPlayerModal.last5} />
                </div>

                <div className="grid grid-cols-3 gap-2 my-2.5 bw-subcard p-3 rounded-2xl border text-center">
                  <div><span className="text-[10px] bw-text-muted font-bold block">Sofascore</span><span className="text-lg font-black text-emerald-600">★{selectedPlayerModal.sofaRating}</span></div>
                  <div><span className="text-[10px] bw-text-muted font-bold block">Puntos</span><span className="text-lg font-black text-amber-500">{selectedPlayerModal.points}</span></div>
                  <div><span className="text-[10px] bw-text-muted font-bold block">Valor</span><span className="text-sm font-black bw-text-main">{formatCOP(selectedPlayerModal.value)}</span></div>
                </div>
                <div className="grid grid-cols-4 gap-1.5 mb-4 bw-subcard p-2.5 rounded-2xl border text-center text-xs">
                  <div><span className="text-[9px] bw-text-muted font-bold block">Partidos</span><span className="font-black bw-text-main">🏟️ {selectedPlayerModal.matchesPlayed || 15}</span></div>
                  <div><span className="text-[9px] bw-text-muted font-bold block">Goles</span><span className="font-black bw-text-main">⚽ {selectedPlayerModal.goals}</span></div>
                  <div><span className="text-[9px] bw-text-muted font-bold block">Asist.</span><span className="font-black bw-text-main">👟 {selectedPlayerModal.assists}</span></div>
                  <div><span className="text-[9px] bw-text-muted font-bold block">Cláusula</span><span className="font-black text-rose-500">{formatCOP(selectedPlayerModal.clause)}</span></div>
                </div>
                <div className="flex flex-wrap gap-2">
                  {(myMemberProfile?.squad || []).includes(selectedPlayerModal.id) ? (
                    <>
                      {(myMemberProfile?.lineup || []).includes(selectedPlayerModal.id) && (
                        <button
                          onClick={() => { handleSetCaptain(selectedPlayerModal.id); setSelectedPlayerModal(null); }}
                          className="w-full py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs cursor-pointer shadow"
                        >
                          ©️ Nombrar Capitán del Equipo (Puntos x2)
                        </button>
                      )}
                      <button onClick={() => { handleToggleLineup(selectedPlayerModal.id); setSelectedPlayerModal(null); }} className="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white font-black text-xs cursor-pointer shadow">
                        {(myMemberProfile?.lineup || []).includes(selectedPlayerModal.id) ? 'Mandar al Banquillo' : 'Alinear de Titular'}
                      </button>
                      <button onClick={() => { handleSellPlayer(selectedPlayerModal); setSelectedPlayerModal(null); }} className="px-4 py-2.5 rounded-xl bg-rose-500/15 text-rose-600 font-black text-xs cursor-pointer">
                        Vender
                      </button>
                    </>
                  ) : playerOwnerMap[selectedPlayerModal.id] ? (
                    <button
                      onClick={() => handlePayReleaseClause(selectedPlayerModal, playerOwnerMap[selectedPlayerModal.id])}
                      className="w-full py-3 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-black text-xs cursor-pointer shadow-lg"
                    >
                      ⚡ Pagar Cláusula a {playerOwnerMap[selectedPlayerModal.id].managerName} ({formatCOP(selectedPlayerModal.clause)})
                    </button>
                  ) : (
                    <button onClick={() => { setSelectedPlayerModal(null); setActiveTab('market'); }} className="w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-white font-black text-xs cursor-pointer shadow-lg">
                      🔨 Ir al Mercado de Fichajes ({formatCOP(selectedPlayerModal.value)})
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {leagueActionModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bw-card border rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-black bw-text-main">{leagueActionModal.type === 'reset' ? '🔄 ¿Reiniciar Temporada?' : '🗑️ ¿Eliminar Liga?'}</h3>
                  <button onClick={() => setLeagueActionModal(null)} className="bw-text-muted hover:text-rose-500 cursor-pointer font-bold">✕</button>
                </div>
                <p className="text-xs bw-text-muted">
                  {leagueActionModal.type === 'reset' ? 'Los puntos volverán a 0 y se sortearán nuevas plantillas iniciales para todos los amigos de la liga.' : 'La liga se eliminará para todos los participantes.'}
                </p>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setLeagueActionModal(null)} className="px-4 py-2 rounded-xl bw-subcard border text-xs font-bold cursor-pointer">Cancelar</button>
                  <button onClick={() => leagueActionModal.type === 'reset' ? handleConfirmResetLeague(leagueActionModal.league) : handleConfirmDeleteLeague(leagueActionModal.league)} className={`px-4 py-2 rounded-xl text-xs font-black cursor-pointer shadow ${leagueActionModal.type === 'reset' ? 'bg-amber-500 text-white' : 'bg-rose-600 text-white'}`}>
                    Confirmar
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
