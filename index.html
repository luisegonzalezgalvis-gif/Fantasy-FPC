    const formatCOP = (num) => {
      if (num >= 1000000) return `$${(num / 1000000).toFixed(1)}M`;
      return `$${(num / 1000).toFixed(0)}K`;
    };

    const getTeamById = (id) => FPC_TEAMS.find(t => t.id === id) || FPC_TEAMS[0];

    const getPosColor = (pos) => {
      switch (pos) {
        case 'POR': return 'bg-amber-500 text-slate-950 border-amber-400';
        case 'DEF': return 'bg-sky-500 text-slate-950 border-sky-400';
        case 'MED': return 'bg-emerald-500 text-slate-950 border-emerald-400';
        case 'DEL': return 'bg-rose-500 text-white border-rose-400';
        default: return 'bg-slate-600 text-white';
      }
    };

    const calculateSofascoreFantasyPoints = (rating, pos, goals = 0, assists = 0, cleanSheet = false) => {
      let basePoints = 0;
      if (rating >= 8.5) basePoints = 10;
      else if (rating >= 8.0) basePoints = 8;
      else if (rating >= 7.5) basePoints = 6;
      else if (rating >= 7.0) basePoints = 4;
      else if (rating >= 6.5) basePoints = 2;
      else if (rating >= 6.0) basePoints = 1;
      else basePoints = -1;

      const goalMultipliers = { POR: 6, DEF: 5, MED: 4, DEL: 3 };
      const goalPts = goals * (goalMultipliers[pos] || 3);
      const assistPts = assists * 3;
      const csPts = (cleanSheet && (pos === 'POR' || pos === 'DEF')) ? 4 : (cleanSheet && pos === 'MED' ? 1 : 0);

      return basePoints + goalPts + assistPts + csPts;
    };

    const pickBalancedStarterSquad = () => {
      const pickRandom = (pos, count) => {
        const pool = INITIAL_PLAYERS.filter(p => p.pos === pos && p.value <= 8800000);
        const shuffled = [...pool].sort(() => 0.5 - Math.random());
        return shuffled.slice(0, count).map(p => p.id);
      };
      return [
        ...pickRandom('POR', 1),
        ...pickRandom('DEF', 4),
        ...pickRandom('MED', 4),
        ...pickRandom('DEL', 2)
      ];
    };

    function App() {

      const appId = typeof __app_id !== 'undefined' ? __app_id : 'fpc-fantasy-colombia';

      useEffect(() => {
        const tryInitFirebase = async () => {
          const mods = window.__FIREBASE_MODULES__;
          if (!mods) return;

          let resolvedConfig = null;
          if (typeof __firebase_config !== 'undefined' && __firebase_config) {
            try { resolvedConfig = JSON.parse(__firebase_config); } catch (e) {}
          }
          if (!resolvedConfig || !resolvedConfig.apiKey) {
            const savedCustom = localStorage.getItem('fpc_custom_firebase_config');
            if (savedCustom) {
              try { resolvedConfig = JSON.parse(savedCustom); } catch (e) {}
            }

          if ((!resolvedConfig || !resolvedConfig.apiKey) && VERCEL_FIREBASE_CONFIG.apiKey) {
            resolvedConfig = VERCEL_FIREBASE_CONFIG;
          }

          if (resolvedConfig && resolvedConfig.apiKey) {
            try {
              const app = mods.initializeApp(resolvedConfig);
              const auth = mods.getAuth(app);
              const db = mods.getFirestore(app);
              if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await mods.signInWithCustomToken(auth, __initial_auth_token);

          setFbReady(true);

        if (window.__FIREBASE_MODULES__) {
          tryInitFirebase();

          window.addEventListener('firebase-modules-ready', tryInitFirebase);

      // Sync with Firestore if Cloud is connected
      useEffect(() => {

      const handleAuthSubmit = async (e) => {

      const currentLeague = useMemo(() => {

      const filteredDatabasePlayers = useMemo(() => {
        return enrichedPlayers
          .filter(p => {
            const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
            const matchesTeam = selectedTeamFilter === 'ALL' || p.teamId === selectedTeamFilter;
            const matchesPos = selectedPosFilter === 'ALL' || p.pos === selectedPosFilter;
            return matchesSearch && matchesTeam && matchesPos;
          })
          .sort((a, b) => {
            if (sortBy === 'value') return b.value - a.value;
            if (sortBy === 'points') return b.points - a.points;
            if (sortBy === 'sofaRating') return b.sofaRating - a.sofaRating;

      const handleSignPlayer = async (player, customBid) => {

        if (price < player.value) {
          showNotification('La oferta no puede ser inferior al valor de mercado', 'error');
          return;

        if (myMemberProfile.budget < price) {
          showNotification('Presupuesto insuficiente para realizar este fichaje', 'error');
          return;

        if ((myMemberProfile.squad || []).includes(player.id)) {
          showNotification('Este jugador ya pertenece a tu plantilla', 'error');
          return;

        const currentOwner = playerOwnerMap[player.id];
        if (currentOwner && currentOwner.userId !== activeAccount.id) {
          const updatedOwner = {
            ...currentOwner,
            budget: (currentOwner.budget || 0) + price,
            squad: (currentOwner.squad || []).filter(id => id !== player.id),
            lineup: (currentOwner.lineup || []).filter(id => id !== player.id)
          };
          await saveMemberData(updatedOwner);
        }

        const updatedMySquad = [...(myMemberProfile.squad || []), player.id];
        const updatedMyLineup = (myMemberProfile.lineup || []).length < 11
          ? [...(myMemberProfile.lineup || []), player.id]
          : myMemberProfile.lineup;

        await saveMemberData({
          ...myMemberProfile,
          budget: myMemberProfile.budget - price,
          squad: updatedMySquad,
          lineup: updatedMyLineup
        });

        const newLog = `💰 ${myMemberProfile.managerName} fichó a ${player.name} (${getTeamById(player.teamId).short}) por ${formatCOP(price)}.`;

          ...currentLeague,

          ...myMemberProfile,
          budget: myMemberProfile.budget + sellValue,
          squad: (myMemberProfile.squad || []).filter(id => id !== player.id),

          ...currentLeague,
          lastLogs: [newLog, ...(currentLeague.lastLogs || []).slice(0, 8)]

        showNotification(`Vendiste a ${player.name} por ${formatCOP(sellValue)}`);

        if (!myMemberProfile) return;
        const currentLineup = myMemberProfile.lineup || [];
        const isStarter = currentLineup.includes(playerId);

        if (isStarter) {

          newLineup = [...currentLineup, playerId];

        await saveMemberData({ ...myMemberProfile, lineup: newLineup });

        if (!currentLeague || simulatingMatchday) return;
        setSimulatingMatchday(true);

        const nextMatchday = (currentLeague.matchday || 1) + 1;
        const customPlayerStats = { ...(currentLeague.customPlayerStats || {}) };
        const matchdayPlayerPoints = {};
        let mvpPlayer = null;
        let mvpPoints = -99;

        enrichedPlayers.forEach(p => {
          const randomDelta = (Math.random() * 1.8) - 0.7;
          const rawRating = Math.min(9.8, Math.max(5.4, p.sofaRating + randomDelta));
          const rating = Number(rawRating.toFixed(2));

          const goalRoll = Math.random();
          let goals = 0;
          if (p.pos === 'DEL' && goalRoll > 0.62) goals = goalRoll > 0.88 ? 2 : 1;
          else if (p.pos === 'MED' && goalRoll > 0.76) goals = 1;
          else if (p.pos === 'DEF' && goalRoll > 0.90) goals = 1;

          const assistRoll = Math.random();
          const assists = (p.pos === 'MED' && assistRoll > 0.72) || (p.pos === 'DEL' && assistRoll > 0.78) ? 1 : 0;
          const cleanSheet = Math.random() > 0.65;

          const earnedPts = calculateSofascoreFantasyPoints(rating, p.pos, goals, assists, cleanSheet);
          matchdayPlayerPoints[p.id] = earnedPts;

          if (earnedPts > mvpPoints) {
            mvpPoints = earnedPts;
            mvpPlayer = { ...p, earnedPts, rating };
          }

          const valueChange = earnedPts >= 8 ? 350000 : earnedPts <= 2 ? -150000 : 100000;
          const updatedLast5 = [...(p.last5 || []).slice(1), earnedPts];

          customPlayerStats[p.id] = {
            points: p.points + earnedPts,
            sofaRating: Number(((p.sofaRating * 0.8) + (rating * 0.2)).toFixed(2)),
            value: Math.max(1500000, p.value + valueChange),
            last5: updatedLast5
          };
        });

        for (const member of leagueMembers) {
          const starters = member.lineup || [];
          let managerMatchdayPts = 0;
          starters.forEach(pId => {
            managerMatchdayPts += (matchdayPlayerPoints[pId] || 0);
          });
          const rewardBonus = Math.max(0, managerMatchdayPts * 100000);
          await saveMemberData({
            ...member,
            points: (member.points || 0) + managerMatchdayPts,
            lastMatchdayPoints: managerMatchdayPts,
            budget: (member.budget || 0) + rewardBonus
          });
        }

        const shuffled = [...INITIAL_PLAYERS].sort(() => 0.5 - Math.random());
        const newMarketIds = shuffled.slice(0, 10).map(p => p.id);
        const mvpLog = mvpPlayer
          ? `⭐ Fecha ${nextMatchday} calculada con Sofascore. MVP: ${mvpPlayer.name} (${mvpPlayer.rating} ★ / +${mvpPlayer.earnedPts} pts).`
          : `⭐ Fecha ${nextMatchday} sincronizada con Sofascore.`;

        await saveLeagueData({
          ...currentLeague,
          matchday: nextMatchday,
          customPlayerStats,
          marketPlayerIds: newMarketIds,
          lastLogs: [mvpLog, ...(currentLeague.lastLogs || []).slice(0, 8)]
        });

        setSimulatingMatchday(false);
        showNotification(`¡Fecha ${nextMatchday} simulada! Puntos y abonos ($100K/pt) acreditados.`);

                            </div>
                          </div>
                          <span className="text-xs font-black text-emerald-400 bg-emerald-950 px-2 py-1 rounded-lg">★ {player.sofaRating}</span>
                        </div>
                        <div className="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between">
                          <span className="text-xs font-black text-white">{formatCOP(player.value)} • <span className="text-amber-400">{player.points} pts</span></span>
                          {!isMine ? (
                            <button
                              onClick={() => handleSignPlayer(player, player.value)}
                              className="px-3 py-1.5 rounded-xl bg-emerald-500 text-slate-950 font-black text-xs cursor-pointer"
                            >
                              {owner ? 'Pagar Cláusula' : 'Fichar'}
                            </button>
                          ) : (
                            <span className="text-xs font-bold text-emerald-400">En tu club</span>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB 5: CENTRO SOFASCORE */}
            {activeTab === 'sofascore' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div className="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                  <h2 className="text-xl font-black text-white">Algoritmo Oficial Sofascore • FPC Fantasy</h2>
                  <p className="text-xs text-slate-400">Así se convierten las calificaciones estadísticas de cada partido de la Liga BetPlay en puntos Fantasy:</p>
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    {[
                      { range: '8.5 o más', pts: '+10 pts' },
                      { range: '8.0 - 8.49', pts: '+8 pts' },
                      { range: '7.5 - 7.99', pts: '+6 pts' },
                      { range: '7.0 - 7.49', pts: '+4 pts' },
                      { range: '6.5 - 6.99', pts: '+2 pts' },
                      { range: 'Menos de 6.0', pts: '-1 pt' }
                    ].map((tier, idx) => (
                      <div key={idx} className="border border-slate-800 bg-slate-950 rounded-xl p-3">
                        <div className="text-xs text-slate-400">{tier.range}</div>
                        <div className="text-lg font-black text-emerald-400 mt-1">{tier.pts}</div>
                      </div>
                    ))}
                  </div>
                </div>
                <div className="lg:col-span-5 bg-slate-900 border border-slate-800 rounded-2xl p-6">
                  <h3 className="text-base font-black text-white mb-4">Top Jugadores Sofascore • Liga BetPlay</h3>
                  <div className="space-y-2.5">
                    {[...enrichedPlayers].sort((a, b) => b.sofaRating - a.sofaRating).slice(0, 6).map((p, i) => (
                      <div key={p.id} className="bg-slate-950 border border-slate-800 rounded-xl p-3 flex items-center justify-between">
                        <div>
                          <div className="text-sm font-bold text-white">#{i + 1} {p.name}</div>
                          <div className="text-xs text-slate-400">{getTeamById(p.teamId).name}</div>
                        </div>
                        <span className="text-sm font-black bg-emerald-500 text-slate-950 px-2.5 py-1 rounded-lg">★ {p.sofaRating}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>

          {}
          {selectedPlayerModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6">
                <div className="flex items-start justify-between">
                  <div>
                    <h3 className="text-xl font-black text-white">{selectedPlayerModal.name}</h3>
                    <p className="text-xs text-slate-400">{getTeamById(selectedPlayerModal.teamId).name}</p>
                  </div>
                  <button onClick={() => setSelectedPlayerModal(null)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>
                <div className="grid grid-cols-3 gap-3 my-5 bg-slate-950 p-3.5 rounded-xl border border-slate-800 text-center">
                  <div>
                    <span className="text-[10px] uppercase text-slate-400 block">Sofascore</span>
                    <span className="text-lg font-black text-emerald-400">★ {selectedPlayerModal.sofaRating}</span>
                  </div>
                  <div>
                    <span className="text-[10px] uppercase text-slate-400 block">Puntos</span>
                    <span className="text-lg font-black text-amber-400">{selectedPlayerModal.points}</span>
                  </div>
                  <div>
                    <span className="text-[10px] uppercase text-slate-400 block">Valor</span>
                    <span className="text-sm font-black text-white">{formatCOP(selectedPlayerModal.value)}</span>
                  </div>
                </div>
                <div className="flex gap-2">
                  {(myMemberProfile?.squad || []).includes(selectedPlayerModal.id) ? (
                    <button
                      onClick={() => {
                        handleToggleLineup(selectedPlayerModal.id);
                        setSelectedPlayerModal(null);
                      }}
                      className="w-full py-2.5 rounded-xl bg-emerald-500 text-slate-950 font-black text-xs cursor-pointer"
                    >
                      {(myMemberProfile?.lineup || []).includes(selectedPlayerModal.id) ? 'Enviar al Banquillo' : 'Poner en el 11 Titular'}
                    </button>
                  ) : (
                    <button
                      onClick={() => {
                        handleSignPlayer(selectedPlayerModal, selectedPlayerModal.value);
                        setSelectedPlayerModal(null);
                      }}
                      className="w-full py-2.5 rounded-xl bg-emerald-500 text-slate-950 font-black text-xs cursor-pointer"
                    >
                      Fichar por {formatCOP(selectedPlayerModal.value)}
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {showCreateLeagueModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <form onSubmit={handleCreateLeague} className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4">
                <h3 className="text-lg font-black text-white">Crear Nueva Liga Fantasy FPC</h3>
                <input
                  type="text"
                  required
                  value={newLeagueName}
                  onChange={(e) => setNewLeagueName(e.target.value)}
                  placeholder="Ej. Liga Amigos Bucaramanga 2026"
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white"
                />
                <div className="flex justify-end gap-2">
                  <button type="button" onClick={() => setShowCreateLeagueModal(false)} className="px-4 py-2 rounded-xl bg-slate-800 text-xs font-bold text-slate-300">Cancelar</button>
                  <button type="submit" className="px-4 py-2 rounded-xl bg-emerald-500 text-slate-950 text-xs font-black">Crear Liga</button>
                </div>
              </form>
            </div>
          )}

          {showJoinLeagueModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <form onSubmit={handleJoinLeagueByCode} className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4">
                <h3 className="text-lg font-black text-white">Unirse a una Liga con Código</h3>
                <input
                  type="text"
                  required
                  value={joinCodeInput}
                  onChange={(e) => setJoinCodeInput(e.target.value)}
                  placeholder="Ej. FPC2026"
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white uppercase font-mono"
                />
                <div className="flex justify-end gap-2">
                  <button type="button" onClick={() => setShowJoinLeagueModal(false)} className="px-4 py-2 rounded-xl bg-slate-800 text-xs font-bold text-slate-300">Cancelar</button>
                  <button type="submit" className="px-4 py-2 rounded-xl bg-emerald-500 text-slate-950 text-xs font-black">Unirse</button>
                </div>
              </form>
            </div>
          )}

          {inspectingMember && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 space-y-4 max-h-[85vh] flex flex-col">
                <div className="flex items-start justify-between">
                  <div>
                    <h3 className="text-xl font-black text-white">{inspectingMember.managerName} • {inspectingMember.clubName}</h3>
                    <p className="text-xs text-slate-400">Presupuesto: {formatCOP(inspectingMember.budget || 0)}</p>
                  </div>
                  <button onClick={() => setInspectingMember(null)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>
                <div className="space-y-2 overflow-y-auto pr-1 flex-1">
                  {(inspectingMember.squad || []).map(pId => {
                    const pl = enrichedPlayers.find(p => p.id === pId);
                    if (!pl) return null;
                    return (
                      <div key={pl.id} className="bg-slate-950 border border-slate-800 rounded-xl p-3 flex items-center justify-between">
                        <div>
                          <div className="text-sm font-bold text-white">{pl.name} ({pl.pos})</div>
                          <div className="text-xs text-slate-400">{getTeamById(pl.teamId).name} • {formatCOP(pl.value)}</div>
                        </div>
                        {inspectingMember.userId !== activeAccount?.id && (
                          <button
                            onClick={() => {
                              handleSignPlayer(pl, pl.value);
                              setInspectingMember(null);
                            }}
                            className="px-3 py-1.5 rounded-xl bg-amber-500 text-slate-950 font-black text-xs cursor-pointer"
                          >
                            Cláusula {formatCOP(pl.value)}
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
