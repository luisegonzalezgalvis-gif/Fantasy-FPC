    const formatCOP = (num) => {
      if (num >= 1000000) return `$${(num / 1000000).toFixed(1)}M`;
      return `$${(num / 1000).toFixed(0)}K`;
    };

    const getTeamById = (id) => FPC_TEAMS.find(t => t.id === id) || FPC_TEAMS[0];

    const getPosColor = (pos) => {
      switch (pos) {
        case 'POR': return 'bg-amber-500 text-slate-950 border-amber-400';
        case 'DEF': return 'bg-sky-500 text-slate-950 border-sky-400';
        case 'MED': return 'bg-emerald-500 text-slate-950 border-emerald-400';
        case 'DEL': return 'bg-rose-500 text-white border-rose-400';
        default: return 'bg-slate-600 text-white';
      }
    };

    const calculateSofascoreFantasyPoints = (rating, pos, goals = 0, assists = 0, cleanSheet = false) => {
      let basePoints = 0;
      if (rating >= 8.5) basePoints = 10;
      else if (rating >= 8.0) basePoints = 8;
      else if (rating >= 7.5) basePoints = 6;
      else if (rating >= 7.0) basePoints = 4;
      else if (rating >= 6.5) basePoints = 2;
      else if (rating >= 6.0) basePoints = 1;
      else basePoints = -1;

      const goalMultipliers = { POR: 6, DEF: 5, MED: 4, DEL: 3 };
      const goalPts = goals * (goalMultipliers[pos] || 3);
      const assistPts = assists * 3;
      const csPts = (cleanSheet && (pos === 'POR' || pos === 'DEF')) ? 4 : (cleanSheet && pos === 'MED' ? 1 : 0);

      return basePoints + goalPts + assistPts + csPts;
    };

    function PitchPlayerCard({ player, onSelect }) {
      const team = getTeamById(player.teamId);
      const lastMatchPts = player.last5?.[player.last5.length - 1] ?? 6;

            style={{ borderColor: team.primary }}

            <p className="text-[11px] font-extrabold text-white truncate text-center">
              {player.name.split(' ').slice(-1)[0]}

          </div>
        </div>
      );

      const generateStarterSquad = () => {
        const pickRandom = (pos, count) => {
          const pool = INITIAL_PLAYERS.filter(p => p.pos === pos && p.value <= 8500000);
          const shuffled = [...pool].sort(() => 0.5 - Math.random());
          return shuffled.slice(0, count).map(p => p.id);
        };
        return [
          ...pickRandom('POR', 1),
          ...pickRandom('DEF', 4),
          ...pickRandom('MED', 4),
          ...pickRandom('DEL', 2)
        ];
      };

        const starterSquad = generateStarterSquad();
        const newMember = {

          leagueId: targetLeagueId,
          userId: account.id,
          managerName: account.managerName,

        if (authMode === 'register') {

      const currentLeague = useMemo(() => {

      const filteredDatabasePlayers = useMemo(() => {
        return enrichedPlayers
          .filter(p => {
            const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
            const matchesTeam = selectedTeamFilter === 'ALL' || p.teamId === selectedTeamFilter;
            const matchesPos = selectedPosFilter === 'ALL' || p.pos === selectedPosFilter;
            const matchesRole = selectedRoleFilter === 'ALL' || p.role === selectedRoleFilter;
            return matchesSearch && matchesTeam && matchesPos && matchesRole;

          .sort((a, b) => {
            if (sortBy === 'value') return b.value - a.value;
            if (sortBy === 'points') return b.points - a.points;

      const handleSignPlayer = async (player, customBid) => {

        const currentOwner = playerOwnerMap[player.id];

      const handleSellPlayer = async (player) => {

          newLineup = [...currentLineup, playerId];

        if (cloudServices.isCloud && cloudServices.db && user) {
          const sdk = window.__FPC_FIREBASE_SDK__;
          await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_members', myMemberProfile.id), {

      const currentWeekMatches = useMemo(() => {
        const completedIds = currentLeague?.completedMatchIds || ['m1', 'm2', 'm3', 'm4', 'm5', 'm6', 'm7', 'm8', 'm9', 'm10'];
        return MATCHDAYS_2026.f15.matches.map(m => {
          const isDone = m.status === 'FINALIZADO' || completedIds.includes(m.id);
          return {
            ...m,
            status: isDone ? 'FINALIZADO' : m.status,
            score: isDone && m.finalScore ? m.finalScore : m.score

      const completedMatchesCount = useMemo(() => {
        return currentWeekMatches.filter(m => m.status === 'FINALIZADO').length;
      }, [currentWeekMatches]);

      const allWeekMatchesFinished = completedMatchesCount === currentWeekMatches.length;

      const handleFinalizeOfficialWeekMatches = async () => {
        if (!currentLeague) return;
        const allIds = MATCHDAYS_2026.f15.matches.map(m => m.id);
        const newLog = '✅ Acta oficial Dimayor recibida: 10 de 10 partidos de la Fecha 15 finalizados. Liquidación de puntos habilitada.';
        if (cloudServices.isCloud && cloudServices.db && user) {
          const sdk = window.__FPC_FIREBASE_SDK__;
          await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_leagues', currentLeague.id), {
            completedMatchIds: allIds,
            lastLogs: [newLog, ...(currentLeague.lastLogs || []).slice(0, 7)]

          setLeagues(prev => prev.map(l => l.id === currentLeague.id

        if (!currentLeague) return;
        if (!allWeekMatchesFinished) {

          return;

        if (isMatchday15Settled) {
          showNotification('Los puntos oficiales de la Fecha 15 ya fueron liquidados en esta liga.', 'error');
          return;

        const customPlayerStats = { ...(currentLeague.customPlayerStats || {}) };
        const matchdayPlayerPoints = {};

        enrichedPlayers.forEach(p => {
          const realMatchPts = p.last5?.[p.last5.length - 1] || calculateSofascoreFantasyPoints(
            p.sofaRating,
            p.pos,
            p.goals > 5 ? 1 : 0,
            p.assists > 4 ? 1 : 0,
            p.cleanSheets >= 6

          matchdayPlayerPoints[p.id] = realMatchPts;
          customPlayerStats[p.id] = {
            points: p.points + realMatchPts,
            sofaRating: p.sofaRating,
            value: p.value + (realMatchPts >= 8 ? 250000 : 0),
            last5: p.last5

        const updatedSettled = [...(currentLeague.settledMatchdays || []), 15];
        const closeLog = '📊 Puntos oficiales de la Fecha 15 liquidados con datos reales de Sofascore tras el cierre de los 10 partidos.';

          for (const member of leagueMembers) {

            await sdk.updateDoc(sdk.doc(cloudServices.db, 'artifacts', appId, 'public', 'data', 'fpc_members', member.id), {
              points: (member.points || 0) + pts,
              lastMatchdayPoints: pts,
              budget: (member.budget || 0) + (pts * 100000)
            });

            settledMatchdays: updatedSettled,
            customPlayerStats,
            lastLogs: [closeLog, ...(currentLeague.lastLogs || []).slice(0, 7)]
          });

            let pts = 0;
            (m.lineup || []).forEach(id => { pts += (matchdayPlayerPoints[id] || 0); });
            return {
              ...m,
              points: (m.points || 0) + pts,
              lastMatchdayPoints: pts,
              budget: (m.budget || 0) + (pts * 100000)
            };
          }));
          setLeagues(prev => prev.map(l => l.id === currentLeague.id
            ? { ...l, matchday: 15, settledMatchdays: updatedSettled, customPlayerStats, lastLogs: [closeLog, ...(l.lastLogs || []).slice(0, 7)] }

                    <button
                      onClick={() => setSelectedTeamFilter('ALL')}
                      className={`px-3 py-2 rounded-xl text-xs font-black shrink-0 border cursor-pointer ${
                        selectedTeamFilter === 'ALL' ? 'bg-emerald-500 text-slate-950 border-emerald-400' : 'bg-slate-950 text-slate-300 border-slate-800'
                      }`}
                    >
                      TODOS LOS 20 CLUBES ({INITIAL_PLAYERS.length})
                    </button>
                    {FPC_TEAMS.map(team => {
                      const count = INITIAL_PLAYERS.filter(p => p.teamId === team.id).length;
                      return (
                        <button
                          key={team.id}
                          onClick={() => setSelectedTeamFilter(team.id)}
                          className={`px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 border flex items-center gap-2 cursor-pointer ${
                            selectedTeamFilter === team.id ? 'ring-2 ring-emerald-400 bg-slate-800 text-white' : 'bg-slate-950 text-slate-300 border-slate-800'
                          }`}
                        >
                          <TeamCrest teamId={team.id} size="sm" />
                          <span>{team.name}</span>
                          <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-900 text-emerald-400 font-black">{count}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4">
                  <div className="relative flex-1 min-w-[240px]">
                    <input
                      type="text"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="Buscar entre los 480 jugadores..."
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                  <div className="flex flex-wrap items-center gap-2">
                    {['ALL', 'POR', 'DEF', 'MED', 'DEL'].map(pos => (
                      <button
                        key={pos}
                        onClick={() => setSelectedPosFilter(pos)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-black cursor-pointer ${
                          selectedPosFilter === pos ? 'bg-emerald-500 text-slate-950' : 'bg-slate-950 text-slate-400 border border-slate-800'
                        }`}
                      >
                        {pos === 'ALL' ? 'Todas las Pos.' : pos}
                      </button>
                    ))}
                    {['ALL', 'Titular', 'Suplente', 'Alternativa', 'Sub-20'].map(role => (
                      <button
                        key={role}
                        onClick={() => setSelectedRoleFilter(role)}
                        className={`px-2.5 py-1.5 rounded-xl text-xs font-bold cursor-pointer ${
                          selectedRoleFilter === role ? 'bg-amber-500 text-slate-950 font-black' : 'bg-slate-950 text-slate-400 border border-slate-800'
                        }`}
                      >
                        {role === 'ALL' ? 'Toda la Plantilla' : role}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {filteredDatabasePlayers.map(player => {
                    const team = getTeamById(player.teamId);
                    const owner = playerOwnerMap[player.id];
                    const isMine = owner?.userId === activeAccount?.id;
                    return (
                      <div key={player.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between">
                        <div className="flex items-start justify-between">
                          <div className="flex items-center gap-2.5">
                            <TeamCrest teamId={player.teamId} size="md" showPos={player.pos} />
                            <div>
                              <h3 onClick={() => setSelectedPlayerModal(player)} className="text-base font-extrabold text-white hover:text-emerald-400 cursor-pointer">
                                {player.name}
                              </h3>
                              <div className="flex items-center gap-1.5 mt-0.5 flex-wrap">
                                <span className="text-[10px] px-2 py-0.5 rounded font-bold" style={{ backgroundColor: team.primary, color: team.text }}>
                                  {team.name}
                                </span>
                                <span className={`text-[10px] px-2 py-0.5 rounded font-extrabold ${
                                  player.role === 'Titular'
                                    ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40'
                                    : player.role === 'Suplente'
                                    ? 'bg-sky-500/20 text-sky-300 border border-sky-500/40'
                                    : 'bg-amber-500/20 text-amber-300 border border-amber-500/40'
                                }`}>
                                  {player.role}
                                </span>
                              </div>
                            </div>
                          </div>
                          <span className="text-xs font-black text-emerald-400 bg-emerald-950 px-2 py-1 rounded-lg">★ {player.sofaRating}</span>
                        </div>

                        <div className="grid grid-cols-3 gap-2 my-4 bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-center text-xs">
                          <div>
                            <span className="text-[9px] text-slate-400 uppercase block">Valor</span>
                            <span className="font-black text-white">{formatCOP(player.value)}</span>
                          </div>
                          <div>
                            <span className="text-[9px] text-slate-400 uppercase block">Puntos</span>
                            <span className="font-black text-amber-400">{player.points}</span>
                          </div>
                          <div>
                            <span className="text-[9px] text-slate-400 uppercase block">Goles/Asist</span>
                            <span className="font-bold text-slate-200">{player.goals}G/{player.assists}A</span>
                          </div>
                        </div>

                        <div className="pt-2 border-t border-slate-800 flex items-center justify-between text-xs">
                          <span className="text-slate-400 truncate">{owner ? `Dueño: ${owner.managerName}` : 'Agente Libre'}</span>
                          {!isMine ? (
                            <button onClick={() => handleSignPlayer(player, player.value)} className="px-3 py-1.5 rounded-xl bg-emerald-500 text-slate-950 font-black text-xs cursor-pointer">
                              {owner ? `Cláusula ${formatCOP(player.value)}` : `Fichar ${formatCOP(player.value)}`}
                            </button>
                          ) : (
                            <span className="font-bold text-emerald-400">En tu equipo</span>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {activeTab === 'sofascore' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div className="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                  <h2 className="text-xl font-black text-white flex items-center gap-2">
                    <Icon name="activity" className="w-5 h-5 text-rose-500" />
                    <span>Centro Sofascore & Criterio de Puntuación Real</span>
                  </h2>
                  <p className="text-xs text-slate-300 leading-relaxed">
                    Los puntos en FPC Fantasy se calculan estrictamente al finalizar los 10 partidos de cada fecha oficial usando las calificaciones estadísticas de Sofascore:
                  </p>
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    {[
                      { range: '8.5 o más', pts: '+10 pts' },
                      { range: '8.0 - 8.49', pts: '+8 pts' },
                      { range: '7.5 - 7.99', pts: '+6 pts' },
                      { range: '7.0 - 7.49', pts: '+4 pts' },
                      { range: '6.5 - 6.99', pts: '+2 pts' },
                      { range: 'Menos de 6.0', pts: '-1 pt' }
                    ].map((t, idx) => (
                      <div key={idx} className="bg-slate-950 border border-slate-800 rounded-xl p-3 text-center">
                        <div className="text-[11px] text-slate-400">{t.range}</div>
                        <div className="text-base font-black text-emerald-400 mt-1">{t.pts}</div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="lg:col-span-5 bg-slate-900 border border-slate-800 rounded-2xl p-6">
                  <h3 className="text-base font-black text-white mb-3">Top Ratings Sofascore Actuales</h3>
                  <div className="space-y-2.5">
                    {[...enrichedPlayers].sort((a, b) => b.sofaRating - a.sofaRating).slice(0, 6).map((p, i) => (
                      <div key={p.id} className="bg-slate-950 border border-slate-800 rounded-xl p-3 flex items-center justify-between">
                        <div className="flex items-center gap-2.5">
                          <span className="font-black text-xs text-slate-500">#{i + 1}</span>
                          <div>
                            <div className="text-sm font-bold text-white">{p.name}</div>
                            <div className="text-xs text-slate-400">{getTeamById(p.teamId).name}</div>
                          </div>
                        </div>
                        <span className="text-sm font-black text-emerald-400 bg-emerald-950 px-2.5 py-1 rounded-lg">★ {p.sofaRating}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>

          {selectedPlayerModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4">
                <div className="flex items-start justify-between">
                  <div className="flex items-center gap-3">
                    <TeamCrest teamId={selectedPlayerModal.teamId} size="lg" showPos={selectedPlayerModal.pos} />
                    <div>
                      <h3 className="text-xl font-black text-white">{selectedPlayerModal.name}</h3>
                      <p className="text-xs text-slate-400">{getTeamById(selectedPlayerModal.teamId).name}</p>
                    </div>
                  </div>
                  <button onClick={() => setSelectedPlayerModal(null)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <div className="grid grid-cols-3 gap-2 bg-slate-950 p-3 rounded-xl border border-slate-800 text-center text-xs">
                  <div>
                    <span className="text-[10px] text-slate-400 block">SofaScore</span>
                    <span className="font-black text-emerald-400 text-base">★ {selectedPlayerModal.sofaRating}</span>
                  </div>
                  <div>
                    <span className="text-[10px] text-slate-400 block">Puntos</span>
                    <span className="font-black text-amber-400 text-base">{selectedPlayerModal.points}</span>
                  </div>
                  <div>
                    <span className="text-[10px] text-slate-400 block">Valor</span>
                    <span className="font-black text-white">{formatCOP(selectedPlayerModal.value)}</span>
                  </div>
                </div>

                <div className="flex gap-2">
                  {(myMemberProfile?.squad || []).includes(selectedPlayerModal.id) ? (
                    <>
                      <button
                        onClick={() => { handleToggleLineup(selectedPlayerModal.id); setSelectedPlayerModal(null); }}
                        className="flex-1 py-2.5 rounded-xl bg-emerald-500 text-slate-950 font-black text-xs cursor-pointer"
                      >
                        {(myMemberProfile?.lineup || []).includes(selectedPlayerModal.id) ? 'Enviar al Banquillo' : 'Poner en el 11 Titular'}
                      </button>
                      <button onClick={() => { handleSellPlayer(selectedPlayerModal); setSelectedPlayerModal(null); }} className="px-4 py-2.5 rounded-xl bg-rose-500/20 text-rose-300 font-bold text-xs cursor-pointer">
                        Vender
                      </button>
                    </>
                  ) : (
                    <button onClick={() => { handleSignPlayer(selectedPlayerModal, selectedPlayerModal.value); setSelectedPlayerModal(null); }} className="w-full py-2.5 rounded-xl bg-emerald-500 text-slate-950 font-black text-xs cursor-pointer">
                      Fichar por {formatCOP(selectedPlayerModal.value)}
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {showCreateLeagueModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <form onSubmit={handleCreateLeague} className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-black text-white">Crear Nueva Liga (Pública o Privada)</h3>
                  <button type="button" onClick={() => setShowCreateLeagueModal(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-300 mb-1">Nombre de la Liga *</label>
                  <input
                    type="text"
                    required
                    value={newLeagueName}
                    onChange={(e) => setNewLeagueName(e.target.value)}
                    placeholder="Ej. Liga Amigos Bucaramanga 2026"
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-300 mb-1.5">Tipo de Acceso *</label>
                  <div className="grid grid-cols-2 gap-3">
                    <button
                      type="button"
                      onClick={() => setNewLeagueVisibility('private')}
                      className={`p-3 rounded-xl border text-left cursor-pointer ${
                        newLeagueVisibility === 'private' ? 'bg-rose-500/15 border-rose-500 text-white' : 'bg-slate-950 border-slate-800 text-slate-400'
                      }`}
                    >
                      <div className="flex items-center gap-2 font-black text-xs text-rose-400">
                        <Icon name="lock" className="w-4 h-4" />
                        <span>Liga Privada</span>
                      </div>
                      <p className="text-[11px] text-slate-400 mt-1">Solo con código de invitación.</p>
                    </button>

                    <button
                      type="button"
                      onClick={() => setNewLeagueVisibility('public')}
                      className={`p-3 rounded-xl border text-left cursor-pointer ${
                        newLeagueVisibility === 'public' ? 'bg-emerald-500/15 border-emerald-500 text-white' : 'bg-slate-950 border-slate-800 text-slate-400'
                      }`}
                    >
                      <div className="flex items-center gap-2 font-black text-xs text-emerald-400">
                        <Icon name="globe" className="w-4 h-4" />
                        <span>Liga Pública</span>
                      </div>
                      <p className="text-[11px] text-slate-400 mt-1">Visible en el directorio abierto.</p>
                    </button>
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setShowCreateLeagueModal(false)} className="px-4 py-2 rounded-xl bg-slate-800 text-xs font-bold cursor-pointer">Cancelar</button>
                  <button type="submit" className="px-5 py-2 rounded-xl bg-emerald-500 text-slate-950 text-xs font-black cursor-pointer">Crear Liga</button>
                </div>
              </form>
            </div>
          )}

          {showJoinLeagueModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-xl w-full p-6 space-y-5 shadow-2xl max-h-[85vh] flex flex-col">
                <div className="flex items-center justify-between">
                  <div>
                    <h3 className="text-lg font-black text-white">Unirse a una Liga</h3>
                    <p className="text-xs text-slate-400">Ingresa un código privado o únete a una liga pública.</p>
                  </div>
                  <button type="button" onClick={() => setShowJoinLeagueModal(false)} className="text-slate-400 hover:text-white font-bold cursor-pointer">✕</button>
                </div>

                <form onSubmit={handleJoinLeagueByCode} className="bg-slate-950 border border-amber-500/30 rounded-2xl p-4 space-y-3">
                  <div className="flex items-center gap-2 text-xs font-black text-amber-400">
                    <Icon name="lock" className="w-4 h-4" />
                    <span>Tengo un Código de Invitación</span>
                  </div>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      required
                      value={joinCodeInput}
                      onChange={(e) => setJoinCodeInput(e.target.value)}
                      placeholder="Código (ej. FPC2026)"
                      className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-white uppercase font-mono"
                    />
                    <button type="submit" className="px-4 py-2 rounded-xl bg-amber-500 text-slate-950 text-xs font-black cursor-pointer">Entrar</button>
                  </div>
                </form>

                <div className="space-y-2.5 overflow-y-auto pr-1 flex-1">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-black uppercase text-emerald-400 flex items-center gap-1.5">
                      <Icon name="globe" className="w-4 h-4" />
                      <span>Directorio de Ligas Públicas ({leagues.filter(l => l.visibility !== 'private').length})</span>
                    </span>
                  </div>
                  {leagues.filter(l => l.visibility !== 'private').map(l => {
                    const count = members.filter(m => m.leagueId === l.id).length;
                    const alreadyIn = members.some(m => m.leagueId === l.id && m.userId === activeAccount?.id);
                    return (
                      <div key={l.id} className="bg-slate-950 border border-slate-800 rounded-xl p-3.5 flex items-center justify-between gap-3">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="text-sm font-black text-white">{l.name}</span>
                            <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-800 text-amber-400 font-bold">#{l.code}</span>
                          </div>
                          <p className="text-xs text-slate-400 mt-0.5">{l.description}</p>
                          <span className="text-[11px] text-emerald-400 font-bold">{count}/{l.maxMembers || 20} DTs inscritos</span>
                        </div>
                        <button
                          type="button"
                          onClick={() => handleJoinPublicLeagueDirect(l)}
                          className="px-3.5 py-2 rounded-xl bg-emerald-500 text-slate-950 text-xs font-black shrink-0 cursor-pointer"
                        >
                          {alreadyIn ? 'Abrir' : 'Unirse'}
                        </button>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {inspectingMember && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 space-y-4 max-h-[80vh] flex flex-col">
                <div className="flex items-start justify-between">
                  <div>
                    <h3 className="text-lg font-black text-white">{inspectingMember.managerName} • {inspectingMember.clubName}</h3>
                    <p className="text-xs text-slate-400">Presupuesto: {formatCOP(inspectingMember.budget || 0)}</p>
                  </div>
                  <button onClick={() => setInspectingMember(null)} className="text-slate-400 hover:text-white text-sm font-bold cursor-pointer">✕</button>
                </div>
                <div className="space-y-2 overflow-y-auto pr-1">
                  {(inspectingMember.squad || []).map(pId => {
                    const pl = enrichedPlayers.find(p => p.id === pId);
                    if (!pl) return null;
                    return (
                      <div key={pl.id} className="bg-slate-950 border border-slate-800 rounded-xl p-3 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                          <TeamCrest teamId={pl.teamId} size="sm" />
                          <div>
                            <div className="text-sm font-bold text-white">{pl.name} ({pl.pos})</div>
                            <div className="text-xs text-slate-400">{getTeamById(pl.teamId).name} • {formatCOP(pl.value)}</div>
                          </div>
                        </div>
                        {inspectingMember.userId !== activeAccount?.id && (
                          <button
                            onClick={() => { handleSignPlayer(pl, pl.value); setInspectingMember(null); }}
                            className="px-3 py-1.5 rounded-xl bg-amber-500 text-slate-950 font-black text-xs cursor-pointer"
                          >
                            Cláusula {formatCOP(pl.value)}
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
